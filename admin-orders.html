<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orders | CoreVault Admin</title>
<meta name="description" content="Admin">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body class="bg-gray-900 text-white font-sans" style="visibility:hidden">
<div id="admin-page" data-active="orders">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
    <div><h1 data-i18n="order_title" class="text-2xl md:text-3xl font-bold">Orders</h1><p data-i18n="order_desc" class="text-gray-400 text-sm md:text-base mt-1">Track purchases.</p></div>
    <button id="btn-csv" class="w-full md:w-auto bg-gray-800 border border-gray-700 hover:bg-gray-700 px-6 py-2.5 rounded-xl font-bold shadow-lg"><span data-i18n="order_export">Export CSV</span></button>
  </div>
  <div class="flex flex-col md:flex-row gap-3 mb-4">
    <div class="flex gap-2 flex-wrap" id="tabs"></div>
    <input type="search" id="search" placeholder="Tìm theo mã đơn, email, sản phẩm…" class="md:ml-auto w-full md:w-80 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
  </div>
  <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg w-full mb-4 overflow-hidden"><div class="overflow-x-auto">
    <table class="w-full min-w-[820px] text-left"><thead class="bg-gray-900/50 text-gray-400 text-xs uppercase tracking-wider"><tr>
      <th class="p-4 font-medium" data-i18n="th_order_id">Order ID</th><th class="p-4 font-medium" data-i18n="th_product">Product</th><th class="p-4 font-medium" data-i18n="th_amount">Amount</th><th class="p-4 font-medium">Thời gian</th><th class="p-4 font-medium" data-i18n="th_status">Status</th><th class="p-4 font-medium text-right" data-i18n="th_action">Actions</th></tr></thead>
    <tbody id="tbody" class="divide-y divide-gray-700/50"></tbody></table></div></div>
  <p id="summary" class="text-sm text-gray-400"></p>
</div>
<script src="lang.js"></script>
<script type="module">
import { adminReady } from './auth-guard.js';
import { db, collection, getDocs, doc, updateDoc, deleteDoc } from './firebase.js';
import { esc, tsOf, fmtDate, fmtPrice, toast, $ } from './common.js';
await adminReady;

let all = [], filter = new URLSearchParams(location.search).get('f') || 'All';
const tbody = $('#tbody');
const TABS = [['All', 'Tất cả'], ['Pending', 'Chờ duyệt'], ['Completed', 'Hoàn thành']];

async function load() {
  tbody.innerHTML = '<tr><td colspan="6" class="text-center p-8 text-gray-500 animate-pulse">Đang tải…</td></tr>';
  try { all = (await getDocs(collection(db, 'orders'))).docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => tsOf(b.timestamp) - tsOf(a.timestamp)); render(); }
  catch (e) { console.error(e); tbody.innerHTML = '<tr><td colspan="6" class="text-center p-8 text-red-400">Lỗi kết nối máy chủ!</td></tr>'; }
}
const view = () => {
  const q = $('#search').value.trim().toLowerCase();
  return all.filter((o) => (filter === 'All' || o.status === filter) && (!q || `${o.orderId} ${o.user} ${o.product}`.toLowerCase().includes(q)));
};
function render() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="px-4 py-2 rounded-xl text-sm font-bold border ${filter === k ? 'bg-blue-600 border-blue-500 text-white' : 'bg-gray-800 border-gray-700 text-gray-400 hover:text-white'}">${l} <span class="opacity-70">(${k === 'All' ? all.length : all.filter((o) => o.status === k).length})</span></button>`).join('');
  const rows = view();
  if (!rows.length) tbody.innerHTML = '<tr><td colspan="6" class="text-center p-8 text-gray-500">Không có giao dịch nào.</td></tr>';
  else tbody.innerHTML = rows.map((o) => {
    const done = o.status === 'Completed';
    const btns = done
      ? `<button data-act="revoke" class="text-yellow-400 hover:text-yellow-300 text-xs font-bold">Thu hồi</button>`
      : `<button data-act="approve" class="bg-green-600 hover:bg-green-500 text-white text-xs font-bold px-3 py-2 rounded-lg shadow-lg">Duyệt đơn</button>`;
    return `<tr data-id="${esc(o.id)}" class="hover:bg-gray-700/20"><td class="p-4 font-mono text-xs md:text-sm text-blue-400 whitespace-nowrap">${esc(o.orderId || o.id.slice(0, 8).toUpperCase())}</td>
      <td class="p-4 min-w-[200px]"><p class="font-bold text-sm line-clamp-2">${esc(o.product)}</p><p class="text-xs text-gray-400 truncate">${esc(o.user)}</p></td>
      <td class="p-4 whitespace-nowrap font-bold text-sm">${o.price > 0 ? esc(fmtPrice(o.price)) : '<span class="text-green-400">FREE</span>'}</td>
      <td class="p-4 whitespace-nowrap text-xs text-gray-400">${esc(fmtDate(o.timestamp))}</td>
      <td class="p-4 whitespace-nowrap"><span class="px-2.5 py-1 border rounded-full text-xs font-bold ${done ? 'bg-green-500/20 text-green-400 border-green-500/30' : 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30 animate-pulse'}">${done ? 'Completed' : 'Pending'}</span></td>
      <td class="p-4 text-right whitespace-nowrap space-x-3">${btns}<button data-act="delete" class="text-red-400 hover:text-red-300 text-xs font-bold">Xóa</button></td></tr>`;
  }).join('');
  const done = rows.filter((o) => o.status === 'Completed').reduce((s, o) => s + (Number(o.price) || 0), 0);
  $('#summary').textContent = `${rows.length} đơn · Doanh thu (đã duyệt): ${fmtPrice(done)}`;
}
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) { filter = b.dataset.tab; render(); } });
$('#search').addEventListener('input', render);

tbody.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('tr').dataset.id, o = all.find((x) => x.id === id), ref = doc(db, 'orders', id);
  try {
    if (b.dataset.act === 'approve') { if (!confirm(`Bạn đã nhận được tiền cho đơn ${o.orderId}? Khách sẽ nhận link tải ngay.`)) return; await updateDoc(ref, { status: 'Completed', approvedAt: Date.now() }); toast('Đã duyệt đơn.', 'success'); }
    if (b.dataset.act === 'revoke') { if (!confirm('Thu hồi quyền tải của đơn này?')) return; await updateDoc(ref, { status: 'Pending' }); toast('Đã thu hồi.', 'success'); }
    if (b.dataset.act === 'delete') { if (!confirm('Xóa vĩnh viễn đơn hàng này?')) return; await deleteDoc(ref); toast('Đã xóa.', 'success'); }
    load();
  } catch (err) { console.error(err); toast('Lỗi: ' + err.message, 'error'); }
});

$('#btn-csv').onclick = () => {
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [['OrderID', 'Product', 'User', 'PriceUSD', 'Status', 'Time'].join(',')]
    .concat(view().map((o) => [q(o.orderId || o.id), q(o.product), q(o.user), Number(o.price) || 0, q(o.status), q(new Date(tsOf(o.timestamp)).toISOString())].join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `orders-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
};
document.addEventListener('languagechange', render);
load();
</script>
</body>
</html>
