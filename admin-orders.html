                    <div class="relative w-40 md:w-64 hidden sm:block">

                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 md:mb-8 gap-4">
                    <div>
                        <h1 data-i18n="order_title" class="text-2xl md:text-3xl font-bold">Transactions</h1>

                    </div>
                    <button class="w-full md:w-auto bg-gray-800 border border-gray-700 hover:bg-gray-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg">
                        <span data-i18n="order_export">Export CSV</span>
                    </button>
                </div>

                <!-- ĐÃ FIX: Bao bọc Bảng (Table) gọn gàng để scroll ngang trên Mobile mà ko lỗi -->
                <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg w-full mb-8 overflow-hidden">

                                    <th data-i18n="th_order_id" class="p-4 font-medium">Order ID</th>

                                    <th class="p-4 font-medium text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="orders-tbody" class="divide-y divide-gray-700/50">

                        </table>

    <script src="lang.js"></script>
    <script type="module" src="auth-guard.js"></script>
    <script>function toggleSidebar() { document.getElementById('admin-sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }</script>
    <script type="module">
        import { db, collection, getDocs, doc, updateDoc } from './firebase.js';

        async function loadOrders() {
            const tbody = document.getElementById('orders-tbody');
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                tbody.innerHTML = ''; 
                if (querySnapshot.empty) { tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500">Chưa có giao dịch nào.</td></tr>'; return; }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data(); const docId = docSnap.id;
                    const shortId = data.orderId || docId.substring(0, 8).toUpperCase();
                    let priceDisplay = data.price === 0 ? '<span data-i18n="val_free" class="text-green-400 font-bold text-sm">FREE</span>' : `<span data-price-value="${data.price}" class="text-white font-bold text-sm"></span>`;
                    
                    let statusDisplay = ''; let actionBtn = '';
                    if (data.status === 'Completed') {
                        statusDisplay = `<span class="px-2.5 py-1 bg-green-500/20 text-green-400 border border-green-500/30 rounded-full text-xs font-bold">Completed</span>`;
                        actionBtn = `<span class="text-gray-500 text-xs">No Action</span>`;
                    } else {
                        statusDisplay = `<span class="px-2.5 py-1 bg-yellow-500/20 text-yellow-500 border border-yellow-500/30 rounded-full text-xs font-bold animate-pulse">Pending</span>`;
                        actionBtn = `<button onclick="approveOrder('${docId}')" class="bg-green-600 hover:bg-green-500 text-white text-xs font-bold px-3 md:px-4 py-2 rounded-lg transition-all shadow-lg whitespace-nowrap">Duyệt Đơn</button>`;
                    }

                    const newRow = document.createElement('tr');
                    newRow.className = "hover:bg-gray-700/20 transition-colors group";
                    newRow.innerHTML = `
                        <td class="p-4 font-mono text-xs md:text-sm text-blue-400 whitespace-nowrap">${shortId}</td>
                        <td class="p-4 min-w-[200px]"><p class="font-bold text-white text-sm line-clamp-2">${data.product}</p><p class="text-xs text-gray-400 flex items-center gap-1 mt-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><span class="truncate">${data.user}</span></p></td>
                        <td class="p-4 whitespace-nowrap">${priceDisplay}</td>
                        <td class="p-4 whitespace-nowrap">${statusDisplay}</td>
                        <td class="p-4 text-right">${actionBtn}</td>
                    `;
                    tbody.prepend(newRow); 
                });
                if (typeof updateLanguage === 'function') updateLanguage();
            } catch (error) { tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-red-500">Lỗi kết nối máy chủ!</td></tr>'; }
        }

        window.approveOrder = async function(docId) {
            if(confirm("Bạn đã nhận được tiền và muốn duyệt đơn hàng này? Khách hàng sẽ nhận được link tải ngay lập tức.")) {
                try { await updateDoc(doc(db, "orders", docId), { status: 'Completed' }); alert("Đã duyệt đơn hàng thành công!"); loadOrders(); } 
                catch(error) { alert("Lỗi thao tác: " + error.message); }
            }
        };

        document.addEventListener("DOMContentLoaded", loadOrders);
    </script>
</body>
</html>
