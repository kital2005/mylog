    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-8">

        <div class="flex-1 overflow-y-auto p-8">
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h1 data-i18n="order_title" class="text-3xl font-bold">Transactions</h1>
                    <p data-i18n="order_desc" class="text-gray-400 mt-1">Track your revenue and order history.</p>
                </div>
                <button class="bg-gray-800 border border-gray-700 hover:bg-gray-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg">
                    <span data-i18n="order_export">Export CSV</span>
                </button>
            </div>

            <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden shadow-lg">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-900/50 text-gray-400 text-xs uppercase tracking-wider">
                        <tr>
                            <th data-i18n="th_order_id" class="p-4 font-medium">Order ID</th>
                            <th data-i18n="th_product" class="p-4 font-medium">Product</th>
                            <th data-i18n="th_amount" class="p-4 font-medium">Amount</th>
                            <th data-i18n="th_status" class="p-4 font-medium">Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody" class="divide-y divide-gray-700/50">
                        <tr><td colspan="4" class="text-center p-8 text-gray-500 animate-pulse">Loading orders from Cloud...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script type="module" src="auth-guard.js"></script>

    <script type="module">
        import { db, collection, getDocs } from './firebase.js';

        async function loadOrders() {
            const tbody = document.getElementById('orders-tbody');

            try {
                // Tải dữ liệu từ collection "orders"
                const querySnapshot = await getDocs(collection(db, "orders"));
                tbody.innerHTML = ''; 

                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center p-8 text-gray-500">Chưa có giao dịch nào.</td></tr>';
                    return;
                }

                // Chạy vòng lặp vẽ từng đơn hàng ra
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Lấy 8 ký tự đầu của Firebase ID làm mã đơn hàng cho đẹp
                    const shortId = doc.id.substring(0, 8).toUpperCase();
                    
                    // Xử lý hiển thị giá tiền
                    let priceDisplay = data.price === 0 
                        ? '<span data-i18n="val_free" class="text-green-400 font-bold text-sm">FREE</span>' 
                        : `<span data-price-value="${data.price}" class="text-white font-bold text-sm"></span>`;

                    const newRow = document.createElement('tr');
                    newRow.className = "hover:bg-gray-700/20 transition-colors group";
                    
                    newRow.innerHTML = `
                        <td class="p-4 font-mono text-sm text-blue-400">#ORD-${shortId}</td>
                        <td class="p-4">
                            <p class="font-bold text-white">${data.product}</p>
                            <p class="text-xs text-gray-400 flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                ${data.user}
                            </p>
                        </td>
                        <td class="p-4">${priceDisplay}</td>
                        <td class="p-4"><span data-i18n="val_completed" class="px-2.5 py-1 bg-green-500/20 text-green-400 border border-green-500/30 rounded-full text-xs font-bold">Completed</span></td>
                    `;
                    
                    tbody.prepend(newRow); // Đưa đơn hàng lên bảng
                });

                // Cập nhật dịch thuật và tỉ giá cho tiền tệ
                if (typeof updateLanguage === 'function') updateLanguage();

            } catch (error) {
                console.error("Lỗi tải đơn hàng:", error);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center p-8 text-red-500">Lỗi kết nối máy chủ!</td></tr>';
            }
        }

        // Tự động chạy khi load trang
        document.addEventListener("DOMContentLoaded", loadOrders);
    </script>
