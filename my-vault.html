<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Vault | CoreVault</title>
<meta name="description" content="Kho đồ của bạn tại CoreVault.">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col" data-page="vault">
<div id="site-header"></div>

<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-12 w-full flex-grow">
  <!-- HỒ SƠ -->
  <section class="bg-gray-800 rounded-3xl p-6 md:p-8 border border-gray-700 shadow-2xl mb-10 flex flex-col md:flex-row items-center md:items-start gap-6 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-r from-blue-600/20 to-purple-600/20"></div>
    <button id="avatar-btn" type="button" class="relative group mt-4 md:mt-0 z-10 shrink-0" title="Change avatar">
      <img id="profile-avatar" alt="" class="w-24 h-24 md:w-32 md:h-32 rounded-full object-cover border-4 border-gray-800 bg-gray-900 group-hover:border-blue-500 transition-colors shadow-xl">
      <span class="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-2xl">📷</span>
    </button>
    <input type="file" id="edit-avatar" class="hidden" accept="image/*">
    <div class="flex-grow text-center md:text-left z-10 pt-2 min-w-0">
      <div class="flex items-center justify-center md:justify-start gap-3 mb-1">
        <h1 id="profile-username" class="text-2xl md:text-3xl font-extrabold text-white truncate"></h1>
        <button id="edit-name" type="button" class="text-gray-400 hover:text-blue-400 transition-colors bg-gray-900/50 p-1.5 rounded-lg border border-gray-700 hover:border-blue-500" data-i18n-title="vault_edit_name" title="Change display name">✏️</button>
      </div>
      <p id="profile-email" class="text-gray-400 text-sm mb-4 break-all"></p>
      <div class="flex flex-wrap items-center justify-center md:justify-start gap-3">
        <span id="profile-plan" class="px-4 py-1.5 bg-gray-700 text-gray-300 rounded-full text-xs font-bold uppercase tracking-widest border border-gray-600"></span>
        <span class="text-xs text-gray-500 font-medium"><b id="stat-owned" class="text-white">0</b> <span data-i18n="vault_owned_count">tools owned</span></span>
      </div>
    </div>
  </section>

  <div class="mb-6 flex items-center justify-between border-b border-gray-800 pb-4">
    <h2 class="text-xl font-bold text-white" data-i18n="vault_title">My Vault</h2>
    <a href="tools.html" class="text-blue-400 hover:text-blue-300 text-sm font-bold" data-i18n="vault_browse">Browse tools →</a>
  </div>
  <div id="inventory-container" class="space-y-4" aria-live="polite"></div>
</main>

<div id="site-footer"></div>
<script src="layout.js"></script>
<script src="lang.js"></script>
<script type="module">
import { db, doc, getDoc, getDocs, updateDoc, writeBatch, collection, query, where } from './firebase.js';
import { onUser, renderHeaderAuth, esc, safeUrl, fileToAvatar, fmtDate, tsOf, toast, t, $, getAdminUids } from './common.js';
import { RESERVED_USERNAMES } from './config.js';

let me = null, orders = null;
const box = $('#inventory-container');

onUser((u, p) => {
  me = p; renderHeaderAuth(p);
  $('#profile-username').textContent = p.username;
  $('#profile-email').textContent = p.email;
  $('#profile-avatar').src = p.avatar;
  const plan = $('#profile-plan');
  plan.setAttribute('data-i18n', p.plan === 'Premium' ? 'plan_premium' : 'plan_free');
  if (p.plan === 'Premium') plan.className = 'px-4 py-1.5 bg-purple-500/20 text-purple-300 rounded-full text-xs font-bold uppercase tracking-widest border border-purple-500/50';
  window.updateLanguage();
  loadInventory();
}, { require: true });

// ---------- Đổi tên ----------
$('#edit-name').onclick = async () => {
  const raw = prompt(t('vault_prompt_name'), me.username);
  if (raw === null) return;
  const name = raw.trim(), key = (n) => n.toLowerCase().replace(/\s+/g, '_');
  if (name === me.username) return;
  if (!/^[\p{L}\p{N}_.\- ]{3,20}$/u.test(name)) return toast(t('err_user_invalid'), 'error');
  if (!me.isAdmin && RESERVED_USERNAMES.includes(name.toLowerCase())) return toast(t('err_user_reserved'), 'error');
  try {
    const taken = await getDoc(doc(db, 'usernames', key(name)));
    if (taken.exists() && taken.data().uid !== me.uid) return toast(t('auth_err_user'), 'error');
    const b = writeBatch(db);
    if (!taken.exists()) b.set(doc(db, 'usernames', key(name)), { uid: me.uid });
    b.update(doc(db, 'users', me.uid), { username: name });
    await b.commit();
    // Giải phóng tên cũ (nếu là tên do hệ thống mới cấp)
    try { const old = await getDoc(doc(db, 'usernames', key(me.username))); if (old.exists() && old.data().uid === me.uid) { const d = writeBatch(db); d.delete(old.ref); await d.commit(); } } catch (e) { /* ignore */ }
    me.username = name; $('#profile-username').textContent = name; renderHeaderAuth(me);
    toast(t('msg_name_ok'), 'success');
  } catch (e) { console.error(e); toast(t('err_generic'), 'error'); }
};

// ---------- Đổi avatar ----------
$('#avatar-btn').onclick = () => $('#edit-avatar').click();
$('#edit-avatar').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = await fileToAvatar(f);
    await updateDoc(doc(db, 'users', me.uid), { avatar: data });
    me.avatar = data; $('#profile-avatar').src = data; renderHeaderAuth(me);
    toast(t('msg_avatar_ok'), 'success');
  } catch (err) { console.error(err); toast(t('err_image'), 'error'); }
  e.target.value = '';
};

// ---------- Kho đồ ----------
async function downloadUrlOf(productId) {
  let prod = null, url = '';
  try { const s = await getDoc(doc(db, 'products', productId)); if (s.exists()) prod = s.data(); } catch (e) { /* ignore */ }
  if (!prod) return { removed: true };
  try { const s = await getDoc(doc(db, 'products', productId, 'private', 'download')); if (s.exists()) url = s.data().downloadUrl || ''; } catch (e) { /* ignore */ }
  if (!url) url = prod.downloadUrl || ''; // sản phẩm cũ (chưa chuyển dữ liệu)
  return { url: safeUrl(url), icon: prod.icon };
}

async function loadInventory() {
  box.innerHTML = '<div class="text-center py-12"><div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div></div>';
  try {
    const map = new Map();
    const q1 = await getDocs(query(collection(db, 'orders'), where('uid', '==', me.uid)));
    q1.forEach((d) => map.set(d.id, { id: d.id, ...d.data() }));
    // Đơn cũ (chưa có uid, chỉ có email) — nếu không đọc được thì bỏ qua
    try { (await getDocs(query(collection(db, 'orders'), where('user', '==', me.email)))).forEach((d) => map.set(d.id, { id: d.id, ...d.data() })); } catch (e) { /* ignore */ }
    orders = [...map.values()].sort((a, b) => tsOf(b.timestamp) - tsOf(a.timestamp));
    await Promise.all(orders.map(async (o) => { o._dl = (o.status === 'Completed' && o.productId) ? await downloadUrlOf(o.productId) : null; }));
    render();
  } catch (e) {
    console.error(e);
    box.innerHTML = `<p class="text-center text-red-400 py-10" data-i18n="err_load">Could not load data.</p>`; window.updateLanguage();
  }
}

function render() {
  if (!orders) return;
  $('#stat-owned').textContent = orders.filter((o) => o.status === 'Completed').length;
  if (!orders.length) {
    box.innerHTML = `<div class="text-center py-16 bg-gray-800/50 rounded-3xl border border-gray-700 border-dashed"><p class="text-gray-400 mb-4" data-i18n="vault_empty">Your vault is empty.</p><a href="tools.html" class="text-blue-400 font-bold hover:text-blue-300" data-i18n="vault_browse">Browse tools →</a></div>`;
    return window.updateLanguage();
  }
  box.innerHTML = orders.map((o) => {
    const done = o.status === 'Completed';
    const badge = done
      ? `<span class="px-3 py-1 bg-green-500/20 text-green-400 border border-green-500/30 rounded-full text-xs font-bold whitespace-nowrap" data-i18n="vault_owned">Owned</span>`
      : `<span class="px-3 py-1 bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 rounded-full text-xs font-bold animate-pulse whitespace-nowrap" data-i18n="vault_pending">Awaiting approval</span>`;
    let action;
    if (!done) action = `<span class="bg-gray-700 text-gray-500 px-5 py-2 rounded-xl text-sm font-bold cursor-not-allowed whitespace-nowrap" data-i18n="vault_unavailable">Not available yet</span>`;
    else if (o._dl && o._dl.removed) action = `<span class="text-gray-500 text-sm font-bold" data-i18n="vault_removed">Tool removed</span>`;
    else if (o._dl && o._dl.url) action = `<a href="${esc(o._dl.url)}" target="_blank" rel="noopener noreferrer" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-lg transition-all whitespace-nowrap" data-i18n="vault_download">Download File</a>`;
    else action = `<span class="bg-red-600/20 text-red-300 border border-red-500/40 px-4 py-2 rounded-xl text-xs font-bold" data-i18n="vault_no_link">Download link missing — contact admin</span>`;
    const name = o.productId ? `<a href="detail.html?id=${encodeURIComponent(o.productId)}" class="hover:text-blue-400 transition-colors">${esc(o.product)}</a>` : esc(o.product);
    return `<div class="bg-gray-800 border border-gray-700 rounded-2xl p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 hover:border-gray-500 transition-colors">
      <div class="min-w-0"><h3 class="text-lg md:text-xl font-bold text-white mb-1 break-words">${name}</h3>
        <p class="text-xs text-gray-500 font-mono"><span data-i18n="vault_order_id">Order ID</span>: ${esc(o.orderId || o.id)} · ${esc(fmtDate(o.timestamp))}</p></div>
      <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end flex-wrap">${badge}${action}</div></div>`;
  }).join('');
  window.updateLanguage();
}
document.addEventListener('languagechange', render);
</script>
</body>
</html>
