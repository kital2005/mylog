<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vault | CoreVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

    <nav class="sticky top-0 z-50 w-full bg-gray-900/80 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0">
                    <a href="index.html" class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent hover:scale-105 transition-transform inline-block">CoreVault</a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-2">
                        <a href="index.html" class="text-gray-300 px-4 py-2 rounded-lg hover:bg-gray-800 transition-all text-sm font-medium">Home</a>
                        <a href="tools.html" class="text-gray-300 px-4 py-2 rounded-lg hover:bg-gray-800 transition-all text-sm font-medium">Tools Vault</a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <div id="header-auth" class="flex items-center gap-3 ml-2"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full flex-grow">
        
        <div class="mb-10 border-b border-gray-800 pb-6 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-white mb-2">My Vault</h1>
                <p class="text-gray-400 text-sm">Quản lý các công cụ bạn đã sở hữu hoặc đang chờ duyệt.</p>
            </div>
        </div>

        <div id="inventory-container" class="space-y-4">
            <div class="text-center py-12">
                <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-gray-500 animate-pulse font-bold tracking-widest uppercase">Đang mở kho đồ...</p>
            </div>
        </div>

    </main>

    <footer class="bg-gray-900 border-t border-gray-800 pt-8 pb-8 w-full mt-auto text-center">
        <p class="text-gray-500 text-xs">© 2026 CoreVault Project.</p>
    </footer>
    
    <script type="module">
        import { db, collection, getDocs, doc, getDoc, auth } from './firebase.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            const authContainer = document.getElementById('header-auth');
            if (user) {
                currentUser = user;
                const userInitials = user.email.substring(0, 2).toUpperCase();
                authContainer.innerHTML = `
                    <div title="${user.email}" class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center font-bold text-sm text-white shadow-lg">${userInitials}</div>
                    <button id="btn-logout" class="text-sm font-bold text-gray-400 hover:text-red-400 transition-colors">Logout</button>
                `;
                document.getElementById('btn-logout').addEventListener('click', () => { signOut(auth).then(() => { window.location.href = "index.html"; }); });
                
                loadInventory();
            } else {
                window.location.href = "auth.html";
            }
        });

        async function loadInventory() {
            const container = document.getElementById('inventory-container');
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                container.innerHTML = ''; 

                let hasItems = false;

                for (const orderDoc of querySnapshot.docs) {
                    const data = orderDoc.data();
                    
                    if (data.user === currentUser.email) {
                        hasItems = true;
                        
                        const isCompleted = data.status === 'Completed';
                        const statusBadge = isCompleted 
                            ? `<span class="px-3 py-1 bg-green-500/20 text-green-400 border border-green-500/30 rounded-full text-xs font-bold">Đã Sở Hữu</span>`
                            : `<span class="px-3 py-1 bg-yellow-500/20 text-yellow-500 border border-yellow-500/30 rounded-full text-xs font-bold animate-pulse">Chờ Admin Duyệt</span>`;

                        let realDownloadLink = "#";
                        if (isCompleted && data.productId) {
                            try {
                                const prodSnap = await getDoc(doc(db, "products", data.productId));
                                if (prodSnap.exists()) {
                                    realDownloadLink = prodSnap.data().downloadUrl || "#";
                                }
                            } catch(e) { console.error("Lỗi lấy link tải: ", e); }
                        }

                        // ĐÃ CẬP NHẬT: XỬ LÝ LỖI KHI ADMIN QUÊN NHẬP LINK TẢI
                        let actionBtn = "";
                        if (isCompleted) {
                            if (realDownloadLink === "#" || realDownloadLink.trim() === "") {
                                actionBtn = `<button onclick="alert('LỖI: Admin chưa cập nhật Link tải cho công cụ này!')" class="bg-red-600 hover:bg-red-500 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-lg transition-all flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Link Lỗi</button>`;
                            } else {
                                actionBtn = `<a href="${realDownloadLink}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-lg transition-all flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Download File</a>`;
                            }
                        } else {
                            actionBtn = `<button disabled class="bg-gray-700 text-gray-500 px-5 py-2 rounded-xl text-sm font-bold cursor-not-allowed">Chưa khả dụng</button>`;
                        }

                        const card = document.createElement('div');
                        card.className = "bg-gray-800 border border-gray-700 rounded-2xl p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 hover:border-gray-500 transition-colors";
                        card.innerHTML = `
                            <div>
                                <h3 class="text-xl font-bold text-white mb-1">${data.product}</h3>
                                <p class="text-sm text-gray-400 font-mono">Mã đơn: ${data.orderId}</p>
                            </div>
                            <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                                ${statusBadge}
                                ${actionBtn}
                            </div>
                        `;
                        container.appendChild(card);
                    }
                }

                if (!hasItems) {
                    container.innerHTML = `
                        <div class="text-center py-16 bg-gray-800/50 rounded-3xl border border-gray-700 border-dashed">
                            <p class="text-gray-400 mb-4">Kho đồ của bạn đang trống trơn.</p>
                            <a href="tools.html" class="text-blue-400 font-bold hover:text-blue-300">Dạo quanh Siêu thị ngay →</a>
                        </div>
                    `;
                }

            } catch (error) {
                console.error("Lỗi:", error);
                container.innerHTML = '<p class="text-center text-red-500 py-10">Lỗi kết nối máy chủ!</p>';
            }
        }
    </script>
</body>
</html>
