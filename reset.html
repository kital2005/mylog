<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset Password | CoreVault</title>
<meta name="description" content="Đặt lại mật khẩu CoreVault.">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center relative overflow-x-hidden py-12">
<div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="w-full max-w-md bg-gray-800/80 backdrop-blur-xl rounded-3xl border border-gray-700 shadow-2xl relative z-10 m-4 p-8">
  <div class="text-center mb-8">
    <a href="index.html" class="inline-block mb-4 hover:scale-110 transition-transform"><img src="logo.svg" alt="CoreVault" class="w-20 h-20 mx-auto drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]"></a>
    <h1 class="text-2xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent" data-i18n="reset_title">Create a new password</h1>
    <p id="reset-sub" class="text-gray-400 text-sm mt-2" data-i18n="reset_sub">Please enter a new password for your account.</p>
  </div>
  <div id="error-msg" class="hidden text-red-300 text-sm text-center font-medium mb-4 bg-red-500/10 border border-red-500/40 rounded-xl px-4 py-3"></div>
  <form id="form-reset" class="space-y-5" novalidate>
    <div>
      <label for="new-pwd" class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2" data-i18n="reset_new">New password</label>
      <input type="password" id="new-pwd" required autocomplete="new-password" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-all">
      <p class="text-xs text-gray-500 mt-2" data-i18n="reset_hint">At least 8 characters, with 1 uppercase letter, 1 number and 1 special character.</p>
    </div>
    <div>
      <label for="confirm-pwd" class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2" data-i18n="auth_pwd_confirm">Confirm Password</label>
      <input type="password" id="confirm-pwd" required autocomplete="new-password" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-all">
    </div>
    <button type="submit" id="btn-submit" data-i18n="reset_btn" class="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg">Update password</button>
  </form>
  <div id="success-msg" class="hidden text-center">
    <div class="w-16 h-16 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-500/50 text-3xl">✓</div>
    <h2 class="text-xl font-bold text-white mb-2" data-i18n="reset_ok_title">Success!</h2>
    <p class="text-gray-400 mb-6" data-i18n="reset_ok_desc">Your password has been changed.</p>
    <a href="auth.html" data-i18n="reset_back_login" class="inline-block w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg">Back to Login</a>
  </div>
</div>
<script src="lang.js"></script>
<script type="module">
import { auth, confirmPasswordReset, verifyPasswordResetCode } from './firebase.js';
import { t, $ } from './common.js';
const code = new URLSearchParams(location.search).get('oobCode');
const err = $('#error-msg');
const showErr = (k) => { err.textContent = t(k); err.classList.remove('hidden'); };
const bad = (c) => c === 'auth/expired-action-code' ? 'err_link_expired' : 'err_link_invalid';

if (!code) { $('#form-reset').classList.add('hidden'); showErr('err_link_invalid'); }
else verifyPasswordResetCode(auth, code).then((email) => { $('#reset-sub').textContent = email; $('#reset-sub').removeAttribute('data-i18n'); })
  .catch((e) => { $('#form-reset').classList.add('hidden'); showErr(bad(e.code)); });

$('#form-reset').addEventListener('submit', async (e) => {
  e.preventDefault(); err.classList.add('hidden');
  const a = $('#new-pwd').value, b = $('#confirm-pwd').value;
  if (a !== b) return showErr('auth_err_match');
  if (a.length < 8 || !/[A-Z]/.test(a) || !/\d/.test(a) || !/[^A-Za-z0-9\s]/.test(a)) return showErr('err_weak');
  const btn = $('#btn-submit'); btn.disabled = true;
  try { await confirmPasswordReset(auth, code, a); $('#form-reset').classList.add('hidden'); $('#success-msg').classList.remove('hidden'); }
  catch (er) { btn.disabled = false; showErr(er.code === 'auth/weak-password' ? 'err_weak' : bad(er.code)); }
});
</script>
</body>
</html>
