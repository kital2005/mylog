<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CoreVault</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex items-center justify-center relative overflow-x-hidden py-12">

    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600/20 rounded-full blur-[100px]"></div>

    <div class="w-full max-w-md bg-gray-800/80 backdrop-blur-xl rounded-3xl border border-gray-700 shadow-2xl overflow-hidden relative z-10 m-4 p-8">
        
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block mb-4 hover:scale-110 transition-transform">
                <img src="logo.svg" alt="CoreVault Logo" class="w-20 h-20 mx-auto drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]">
            </a>
            <h2 class="text-2xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">Tạo Mật Khẩu Mới</h2>
            <p class="text-gray-400 text-sm mt-2">Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>
        </div>

        <form id="form-reset" onsubmit="submitNewPassword(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Mật khẩu mới</label>
                <input type="password" id="new-pwd" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-all" placeholder="Nhập mật khẩu mới">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Xác nhận mật khẩu</label>
                <input type="password" id="confirm-pwd" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-all" placeholder="Nhập lại mật khẩu">
            </div>
            
            <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg mt-4">
                Cập nhật mật khẩu
            </button>
            <div id="error-msg" class="text-red-400 text-sm text-center font-medium mt-3 hidden"></div>
        </form>

        <div id="success-msg" class="hidden text-center">
            <div class="w-16 h-16 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-500/50">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">Thành công!</h3>
            <p class="text-gray-400 mb-6">Mật khẩu của bạn đã được thay đổi.</p>
            <a href="auth.html" class="inline-block w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg">
                Quay lại Đăng nhập
            </a>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase.js';
        import { confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Lấy mã xác thực bí mật từ URL mà Firebase gửi trong Email
        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');

        if (!actionCode) {
            document.getElementById('form-reset').style.display = 'none';
            document.getElementById('error-msg').innerText = "Liên kết không hợp lệ hoặc đã hết hạn!";
            document.getElementById('error-msg').classList.remove('hidden');
        }

        window.submitNewPassword = function(e) {
            e.preventDefault();
            const newPwd = document.getElementById('new-pwd').value;
            const confirmPwd = document.getElementById('confirm-pwd').value;
            const errorEl = document.getElementById('error-msg');
            const btnSubmit = document.getElementById('btn-submit');

            if (newPwd !== confirmPwd) {
                errorEl.innerText = "Mật khẩu không khớp. Vui lòng kiểm tra lại!";
                errorEl.classList.remove('hidden');
                return;
            }

            if (newPwd.length < 6) {
                errorEl.innerText = "Mật khẩu phải có ít nhất 6 ký tự!";
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            btnSubmit.innerText = "Đang xử lý...";
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-50');

            // Gửi mật khẩu mới lên Firebase kèm mã xác thực
            confirmPasswordReset(auth, actionCode, newPwd)
                .then(() => {
                    document.getElementById('form-reset').classList.add('hidden');
                    document.getElementById('success-msg').classList.remove('hidden');
                })
                .catch((error) => {
                    btnSubmit.innerText = "Cập nhật mật khẩu";
                    btnSubmit.disabled = false;
                    btnSubmit.classList.remove('opacity-50');
                    
                    if (error.code === 'auth/expired-action-code') {
                        errorEl.innerText = "Liên kết này đã hết hạn. Vui lòng yêu cầu cấp lại link mới.";
                    } else if (error.code === 'auth/invalid-action-code') {
                        errorEl.innerText = "Liên kết không hợp lệ hoặc đã được sử dụng.";
                    } else {
                        errorEl.innerText = "Đã xảy ra lỗi: " + error.message;
                    }
                    errorEl.classList.remove('hidden');
                });
        }
    </script>
</body>
</html>
