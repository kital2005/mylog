<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard | CoreVault Admin</title>
<meta name="description" content="Admin">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body class="bg-gray-900 text-white font-sans" style="visibility:hidden">
<div id="admin-page" data-active="dashboard">
  <div class="mb-6 md:mb-8"><h1 data-i18n="dash_overview" class="text-2xl md:text-3xl font-bold">Overview</h1><p data-i18n="dash_welcome" class="text-gray-400 text-sm md:text-base mt-1">Welcome back.</p></div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-6">
    <div class="bg-gray-800 rounded-2xl p-4 md:p-6 border border-gray-700 shadow-lg"><p class="text-gray-400 text-xs md:text-sm font-medium flex items-center gap-2 mb-2"><span class="w-2 h-2 rounded-full bg-green-500"></span><span data-i18n="dash_active">Active Tools</span></p><h3 id="s-active" class="text-2xl md:text-3xl font-bold">–</h3></div>
    <div class="bg-gray-800 rounded-2xl p-4 md:p-6 border border-gray-700 shadow-lg"><p class="text-gray-400 text-xs md:text-sm font-medium flex items-center gap-2 mb-2"><span class="w-2 h-2 rounded-full bg-blue-500"></span><span data-i18n="dash_visits">Total Tools</span></p><h3 id="s-tools" class="text-2xl md:text-3xl font-bold">–</h3></div>
    <div class="bg-gray-800 rounded-2xl p-4 md:p-6 border border-gray-700 shadow-lg"><p class="text-gray-400 text-xs md:text-sm font-medium flex items-center gap-2 mb-2"><span class="w-2 h-2 rounded-full bg-cyan-500"></span>Người dùng</p><h3 id="s-users" class="text-2xl md:text-3xl font-bold">–</h3></div>
    <div class="bg-gray-800 rounded-2xl p-4 md:p-6 border border-gray-700 shadow-lg"><p class="text-gray-400 text-xs md:text-sm font-medium flex items-center gap-2 mb-2"><span class="w-2 h-2 rounded-full bg-purple-500"></span><span data-i18n="dash_new_users">Total Orders</span></p><h3 id="s-orders" class="text-2xl md:text-3xl font-bold">–</h3></div>
    <div class="bg-gray-800 rounded-2xl p-4 md:p-6 border border-yellow-500/30 shadow-lg"><p class="text-gray-400 text-xs md:text-sm font-medium flex items-center gap-2 mb-2"><span class="w-2 h-2 rounded-full bg-yellow-500"></span>Chờ duyệt</p><a href="admin-orders.html?f=Pending" id="s-pending" class="text-2xl md:text-3xl font-bold text-yellow-400">–</a></div>
    <div class="bg-gray-800 rounded-2xl p-4 md:p-6 border border-gray-700 shadow-lg col-span-1 lg:col-span-3"><p class="text-gray-400 text-xs md:text-sm font-medium flex items-center gap-2 mb-2"><span class="w-2 h-2 rounded-full bg-green-500"></span><span data-i18n="dash_revenue">Total Revenue</span></p><h3 id="s-revenue" class="text-2xl md:text-3xl font-bold text-green-400 truncate">–</h3></div>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 bg-gray-800 rounded-2xl border border-gray-700 p-4 md:p-6 shadow-lg">
      <h3 class="text-base md:text-lg font-bold mb-4">Doanh thu & đơn hàng 7 ngày gần nhất</h3>
      <div class="h-64 w-full"><canvas id="chart"></canvas></div>
    </div>
    <div class="bg-gray-800 rounded-2xl border border-gray-700 p-4 md:p-6 shadow-lg flex flex-col">
      <div class="flex justify-between items-center mb-4"><h3 data-i18n="dash_sales" class="text-base md:text-lg font-bold">Recent Sales</h3><a href="admin-orders.html" class="text-xs text-blue-400 hover:text-blue-300 font-bold">Xem tất cả →</a></div>
      <div id="recent" class="space-y-3 flex-grow overflow-y-auto"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="lang.js"></script>
<script type="module">
import { adminReady } from './auth-guard.js';
import { db, collection, getDocs } from './firebase.js';
import { esc, tsOf, fmtPrice, fmtDate, lang, $ } from './common.js';
await adminReady;

let orders = [], chart = null;
try {
  const [ps, os, us] = await Promise.all([getDocs(collection(db, 'products')), getDocs(collection(db, 'orders')), getDocs(collection(db, 'users'))]);
  $('#s-tools').textContent = ps.size; $('#s-active').textContent = ps.docs.filter((d) => d.data().status === 'Active').length;
  $('#s-users').textContent = us.size; $('#s-orders').textContent = os.size;
  orders = os.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => tsOf(b.timestamp) - tsOf(a.timestamp));
  $('#s-pending').textContent = orders.filter((o) => o.status === 'Pending').length;
  render();
} catch (e) { console.error(e); $('#recent').innerHTML = '<p class="text-red-400 text-sm">Không tải được dữ liệu (kiểm tra Firestore Rules / kết nối).</p>'; }

function render() {
  const done = orders.filter((o) => o.status === 'Completed');
  $('#s-revenue').textContent = fmtPrice(done.reduce((s, o) => s + (Number(o.price) || 0), 0));
  $('#recent').innerHTML = orders.slice(0, 6).map((o) => `<div class="flex items-center justify-between gap-3 p-3 bg-gray-900/50 rounded-xl border border-gray-700/50">
    <div class="min-w-0"><p class="text-sm font-bold truncate">${esc(o.product)}</p><p class="text-xs text-gray-500 truncate">${esc(String(o.user || '').split('@')[0])} · ${esc(fmtDate(o.timestamp))}</p></div>
    <div class="text-right shrink-0"><p class="text-sm font-bold ${o.price > 0 ? 'text-green-400' : 'text-gray-400'}">${o.price > 0 ? esc(fmtPrice(o.price)) : 'FREE'}</p><p class="text-[10px] ${o.status === 'Completed' ? 'text-green-500' : 'text-yellow-500'}">${esc(o.status)}</p></div></div>`).join('') || '<p class="text-gray-500 text-sm text-center">Chưa có giao dịch.</p>';
  // Biểu đồ 7 ngày từ dữ liệu thật
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (6 - i)); return d; });
  const key = (d) => d.toDateString();
  const rev = Object.fromEntries(days.map((d) => [key(d), 0])), cnt = { ...rev };
  orders.forEach((o) => { const k = key(new Date(tsOf(o.timestamp))); if (k in cnt) { cnt[k]++; if (o.status === 'Completed') rev[k] += Number(o.price) || 0; } });
  const labels = days.map((d) => d.toLocaleDateString(lang() === 'vn' ? 'vi-VN' : 'en-US', { weekday: 'short', day: 'numeric' }));
  if (chart) chart.destroy();
  chart = new Chart($('#chart'), {
    data: { labels, datasets: [
      { type: 'line', label: 'Doanh thu (USD)', data: days.map((d) => rev[key(d)]), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', borderWidth: 3, tension: 0.4, fill: true, yAxisID: 'y' },
      { type: 'bar', label: 'Số đơn', data: days.map((d) => cnt[key(d)]), backgroundColor: 'rgba(168,85,247,0.5)', borderRadius: 6, yAxisID: 'y1' } ] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#9ca3af' } } },
      scales: { y: { beginAtZero: true, grid: { color: '#374151' }, ticks: { color: '#9ca3af' } }, y1: { beginAtZero: true, position: 'right', grid: { display: false }, ticks: { color: '#9ca3af', precision: 0 } }, x: { grid: { display: false }, ticks: { color: '#9ca3af' } } } }
  });
  window.updateLanguage();
}
document.addEventListener('languagechange', () => orders.length && render());
</script>
</body>
</html>
