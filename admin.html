            <a href="admin.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-600/30 font-medium transition-all">

            </a>
            <a href="admin-products.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                <span data-i18n="admin_products">Products</span>
            </a>
            <a href="admin-users.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span data-i18n="admin_users">Users</span>
            </a>
            <a href="admin-orders.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span data-i18n="admin_orders">Orders</span>
            </a>
<a href="admin-settings.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>

    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-8">
            <div class="relative w-64">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                    <svg class="w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </span>
                <input type="text" data-i18n="admin_search" class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-blue-500 transition-colors text-sm" placeholder="Search orders, users...">
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleLanguage()" class="text-gray-300 hover:text-white px-3 py-1.5 text-sm font-medium border border-gray-700 hover:border-gray-500 hover:bg-gray-800 rounded-lg transition-all flex items-center gap-1">
                    <span data-i18n="lang_btn">EN / VN</span>
                </button>
                <button class="text-gray-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg></button>
                <div onclick="logoutAdmin()" title="Đăng Xuất" class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center font-bold text-sm shadow-lg cursor-pointer hover:scale-110 transition-transform">LR</div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h1 data-i18n="dash_overview" class="text-3xl font-bold text-white">Overview</h1>
                    <p data-i18n="dash_welcome" class="text-gray-400 mt-1">Welcome back. Here's what's happening with your platform.</p>
                </div>
            <div class="bg-gray-800 p-1 rounded-lg border border-gray-700 flex text-sm">
                <button data-i18n="dash_today" class="px-4 py-1.5 text-gray-400 hover:text-white transition-colors">Today</button>
                <button data-i18n="dash_week" class="px-4 py-1.5 bg-gray-700 text-white rounded shadow transition-colors">This Week</button>
                <button data-i18n="dash_month" class="px-4 py-1.5 text-gray-400 hover:text-white transition-colors">This Month</button>
            </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="flex items-center gap-2 mb-4">
                        <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(34,197,94,0.8)]"></span>
                        <h3 data-i18n="dash_active" class="text-gray-400 font-medium text-sm">Active Tools</h3>
                    </div>
                    <p id="stat-active" class="text-4xl font-bold text-white">0</p>
                </div>

                <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl shadow-lg">
                    <h3 data-i18n="dash_visits" class="text-gray-400 font-medium text-sm mb-4">Total Tools</h3>
                    <p id="stat-total-tools" class="text-4xl font-bold text-white">0</p>
                </div>

                <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl shadow-lg">
                    <h3 data-i18n="dash_new_users" class="text-gray-400 font-medium text-sm mb-4">Total Orders</h3>
                    <p id="stat-orders" class="text-4xl font-bold text-white">0</p>
                </div>

                <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl shadow-lg">
                     <h3 data-i18n="dash_revenue" class="text-gray-400 font-medium text-sm mb-4">Total Revenue</h3>
                     <p id="stat-revenue" data-price-value="0" class="text-4xl font-bold text-white bg-gradient-to-r from-green-400 to-blue-500 bg-clip-text text-transparent">$0</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-gray-800 border border-gray-700 p-6 rounded-2xl shadow-lg">
                    <h3 data-i18n="dash_chart" class="text-lg font-bold text-white mb-4">Traffic & Revenue Overview</h3>
                    <div class="h-72 w-full">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>

                <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl shadow-lg flex flex-col">
                    <h3 data-i18n="dash_sales" class="text-lg font-bold text-white mb-4">Recent Sales</h3>
                    <div id="recent-sales-list" class="space-y-4 overflow-y-auto flex-1 pr-2">
                        <p class="text-gray-500 text-sm animate-pulse">Loading orders from Cloud...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script type="module" src="auth-guard.js"></script>

    <script type="module">
        import { db, collection, getDocs, addDoc } from './firebase.js';

        async function loadDashboardData() {
            try {
                // 1. LẤY DỮ LIỆU SẢN PHẨM (Đếm tổng tool và tool đang hoạt động)
                const prodSnap = await getDocs(collection(db, 'products'));
                let totalTools = 0;
                let activeTools = 0;
                
                prodSnap.forEach(doc => {
                    totalTools++;
                    if(doc.data().status === 'Active') activeTools++;
                });

                document.getElementById('stat-total-tools').innerText = totalTools;
                document.getElementById('stat-active').innerText = activeTools;

                // 2. LẤY DỮ LIỆU ĐƠN HÀNG
                const orderSnap = await getDocs(collection(db, 'orders'));
                
                if (orderSnap.empty) {
                    const dummyOrders = [
                        { product: "Auto Recoil V2", user: "gamer_pro12", price: 19.99, date: new Date().getTime() },
                        { product: "Neon Stream Pack", user: "vtuber_xyz", price: 25.00, date: new Date().getTime() },
                        { product: "System Optimizer", user: "pc_master", price: 9.99, date: new Date().getTime() },
                        { product: "Free Overlay", user: "newbie_stream", price: 0, date: new Date().getTime() }
                    ];
                    for (let order of dummyOrders) {
                        await addDoc(collection(db, 'orders'), order);
                    }
                    window.location.reload();
                    return;
                }

                let totalOrders = 0;
                let totalRevenue = 0;
                const salesList = document.getElementById('recent-sales-list');
                salesList.innerHTML = '';

                orderSnap.forEach(doc => {
                    totalOrders++;
                    const data = doc.data();
                    totalRevenue += data.price;

                    if (data.price > 0) {
                        salesList.innerHTML += `
                            <div class="flex items-center justify-between pb-4 border-b border-gray-700/50">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-lg bg-gray-700 flex items-center justify-center text-xl">🛒</div>
                                    <div>
                                        <p class="text-sm font-bold text-white">${data.product}</p>
                                        <p class="text-xs text-gray-400">${data.user}</p>
                                    </div>
                                </div>
                                <span class="text-green-400 font-bold text-sm flex items-center gap-1">+ <span data-price-value="${data.price}"></span></span>
                            </div>
                        `;
                    }
                });

                document.getElementById('stat-orders').innerText = totalOrders;
                document.getElementById('stat-revenue').setAttribute('data-price-value', totalRevenue);

                if (typeof updateLanguage === 'function') updateLanguage();

            } catch (error) {
                console.error("Lỗi tải Dashboard:", error);
            }
        }

        document.addEventListener("DOMContentLoaded", loadDashboardData);

        const ctx = document.getElementById('mainChart').getContext('2d');
        let gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(59, 130, 246, 0.5)');
        gradient.addColorStop(1, 'rgba(59, 130, 246, 0)');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Page Views',
                    data: [1200, 1900, 1500, 2200, 2800, 3500, 3100],
                    borderColor: '#3b82f6',
                    backgroundColor: gradient,
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#374151' }, ticks: { color: '#9ca3af' } },
                    x: { grid: { display: false }, ticks: { color: '#9ca3af' } }
                }
            }
        });
    </script>
</body>
</html>
