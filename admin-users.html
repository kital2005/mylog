    <script src="lang.js"></script>
    <script type="module" src="auth-guard.js"></script>

    <script type="module">
        import { db, collection, getDocs, addDoc, doc, updateDoc } from './firebase.js';

        async function loadUsers() {
            const tbody = document.getElementById('users-tbody');

            try {
                // Tải dữ liệu từ collection "users"
                const querySnapshot = await getDocs(collection(db, "users"));
                tbody.innerHTML = ''; 

                // Nếu kho chưa có gì, tự động tạo 3 tài khoản mẫu
                if (querySnapshot.empty) {
                    const dummyUsers = [
                        { email: "thaituan.28012020@gmail.com", plan: "Premium", status: "Active" },
                        { email: "khachhang@gmail.com", plan: "Free", status: "Active" },
                        { email: "alex.pro@gmail.com", plan: "Premium", status: "Banned" }
                    ];
                    for (let u of dummyUsers) {
                        await addDoc(collection(db, "users"), u);
                    }
                    window.location.reload(); // Tải lại trang để hiện dữ liệu mới tạo
                    return;
                }

                // Vẽ từng user ra bảng
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    
                    // Style cho Gói cước (Plan)
                    const planColor = data.plan === 'Premium' ? 'text-purple-400 font-bold' : 'text-gray-400 font-bold';
                    const planI18n = data.plan === 'Premium' ? 'val_premium' : 'val_free';
                    
                    // Style cho Trạng thái (Status)
                    let statusDisplay = '';
                    if (data.status === 'Active') {
                        statusDisplay = `<span data-i18n="val_active" class="px-2.5 py-1 bg-green-500/20 text-green-400 border border-green-500/30 rounded-full text-xs font-bold">Active</span>`;
                    } else {
                        // Nếu bị ban thì hiện nhãn đỏ
                        statusDisplay = `<span class="px-2.5 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-full text-xs font-bold">Banned</span>`;
                    }

                    // Style cho Nút bấm (Thao tác)
                    const actionBtn = data.status === 'Active' 
                        ? `<button onclick="toggleBan('${docId}', 'Banned')" data-i18n="btn_ban" class="text-gray-400 hover:text-red-400 px-3 py-1 border border-transparent hover:border-red-500/50 rounded transition-all">Ban</button>`
                        : `<button onclick="toggleBan('${docId}', 'Active')" class="text-gray-400 hover:text-green-400 px-3 py-1 border border-transparent hover:border-green-500/50 rounded transition-all">Unban</button>`;

                    const newRow = document.createElement('tr');
                    newRow.className = "hover:bg-gray-700/20 transition-colors group";
                    
                    newRow.innerHTML = `
                        <td class="p-4 font-medium text-white">${data.email}</td>
                        <td class="p-4 ${planColor}"><span data-i18n="${planI18n}">${data.plan}</span></td>
                        <td class="p-4">${statusDisplay}</td>
                        <td class="p-4 text-right">${actionBtn}</td>
                    `;
                    
                    tbody.appendChild(newRow);
                });

                if (typeof updateLanguage === 'function') updateLanguage();

            } catch (error) {
                console.error("Lỗi tải users:", error);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center p-8 text-red-500">Lỗi kết nối máy chủ!</td></tr>';
            }
        }

        // HÀM CHUYỂN ĐỔI TRẠNG THÁI KHÓA / MỞ KHÓA TÀI KHOẢN
        window.toggleBan = async function(docId, newStatus) {
            const actionName = newStatus === 'Banned' ? "KHÓA" : "MỞ KHÓA";
            if(confirm(`Bạn có chắc chắn muốn ${actionName} tài khoản này không?`)) {
                try {
                    const userRef = doc(db, "users", docId);
                    await updateDoc(userRef, { status: newStatus });
                    loadUsers(); // Cập nhật lại bảng ngay lập tức
                } catch(error) {
                    alert("Lỗi thao tác: " + error.message);
                }
            }
        };

        // Tự động chạy khi load trang
        document.addEventListener("DOMContentLoaded", loadUsers);
    </script>
