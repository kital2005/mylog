                <a href="admin-products.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> <span data-i18n="admin_orders">Orders</span>
                </a>

                        <input type="text" data-i18n="admin_search" class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-blue-500 transition-colors text-sm" placeholder="Search...">

                </div>
                <div class="flex items-center gap-3 md:gap-4">

                    <div class="flex items-center gap-2">

                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8">

                        <h1 data-i18n="user_title" class="text-2xl md:text-3xl font-bold">Users Management</h1>
                        <p data-i18n="user_desc" class="text-gray-400 text-sm md:text-base mt-1">Monitor accounts and security logs.</p>
                    </div>
                    <button class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg">
                        <span data-i18n="user_add">Add User</span>
                    </button>
                </div>

                <!-- ĐÃ FIX: Bao bọc Table tránh lỗi văng scroll -->
                <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg w-full mb-8 overflow-hidden">
                    <div class="overflow-x-auto w-full">
                        <table class="w-full min-w-[700px] text-left border-collapse">
                            <thead class="bg-gray-900/50 text-gray-400 text-xs uppercase tracking-wider">

                                    <th data-i18n="th_user" class="p-4 font-medium">User</th>
                                    <th data-i18n="th_plan" class="p-4 font-medium">Plan</th>
                                    <th data-i18n="th_status" class="p-4 font-medium">Status</th>
                                    <th data-i18n="th_action" class="p-4 font-medium text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-tbody" class="divide-y divide-gray-700/50">
                                <tr><td colspan="4" class="text-center p-8 text-gray-500 animate-pulse">Đang tải danh sách...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

    <script src="lang.js"></script>
    <script type="module" src="auth-guard.js"></script>
    <script>function toggleSidebar() { document.getElementById('admin-sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }</script>
    
    <script type="module">
        import { db, collection, getDocs, addDoc, doc, updateDoc, deleteDoc } from './firebase.js';

        async function loadUsers() {
            const tbody = document.getElementById('users-tbody');
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                tbody.innerHTML = ''; 
                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center p-8 text-gray-500">Chưa có người dùng nào.</td></tr>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data(); const docId = docSnap.id;
                    const planColor = data.plan === 'Premium' ? 'text-purple-400 font-bold' : 'text-gray-400 font-bold';
                    const planI18n = data.plan === 'Premium' ? 'val_premium' : 'val_free';
                    
                    let statusDisplay = data.status === 'Active' 
                        ? `<span data-i18n="val_active" class="px-2.5 py-1 bg-green-500/20 text-green-400 border border-green-500/30 rounded-full text-xs font-bold">Active</span>`
                        : `<span class="px-2.5 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-full text-xs font-bold">Banned</span>`;

                    const actionBtn = data.status === 'Active' 
                        ? `<button onclick="toggleBan('${docId}', 'Banned')" data-i18n="btn_ban" class="text-gray-400 hover:text-yellow-500 px-3 py-1 border border-transparent hover:border-yellow-500/50 rounded transition-all text-sm whitespace-nowrap">Ban</button>`
                        : `<button onclick="toggleBan('${docId}', 'Active')" class="text-gray-400 hover:text-green-400 px-3 py-1 border border-transparent hover:border-green-500/50 rounded transition-all text-sm whitespace-nowrap">Unban</button>`;
                        
                    const deleteBtn = `<button onclick="deleteUser('${docId}')" class="text-gray-400 hover:text-red-500 px-3 py-1 border border-transparent hover:border-red-500/50 rounded transition-all text-sm whitespace-nowrap">Delete</button>`;

                    const newRow = document.createElement('tr');
                    newRow.className = "hover:bg-gray-700/20 transition-colors group";
                    newRow.innerHTML = `
                        <td class="p-4 font-medium text-white text-sm whitespace-nowrap">${data.email}</td>
                        <td class="p-4 ${planColor} text-sm whitespace-nowrap"><span data-i18n="${planI18n}">${data.plan}</span></td>
                        <td class="p-4 whitespace-nowrap">${statusDisplay}</td>
                        <td class="p-4 text-right flex justify-end gap-2">${actionBtn}${deleteBtn}</td>
                    `;
                    tbody.appendChild(newRow);
                });
                if (typeof updateLanguage === 'function') updateLanguage();
            } catch (error) { tbody.innerHTML = '<tr><td colspan="4" class="text-center p-8 text-red-500">Lỗi kết nối máy chủ!</td></tr>'; }
        }

        window.toggleBan = async function(docId, newStatus) {
            const actionName = newStatus === 'Banned' ? "KHÓA" : "MỞ KHÓA";
            if(confirm(`Bạn có chắc chắn muốn ${actionName} tài khoản này không?`)) {
                try { await updateDoc(doc(db, "users", docId), { status: newStatus }); loadUsers(); } 
                catch(error) { alert("Lỗi thao tác: " + error.message); }
            }
        };

        window.deleteUser = async function(docId) {
            if(confirm("Bạn có chắc chắn muốn XÓA VĨNH VIỄN người dùng này khỏi Database không?")) {
                try { await deleteDoc(doc(db, "users", docId)); loadUsers(); } 
                catch(error) { alert("Lỗi thao tác: " + error.message); }
            }
        };

        document.addEventListener("DOMContentLoaded", loadUsers);
    </script>
</body>
</html>
