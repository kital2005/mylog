<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Users | CoreVault Admin</title>
<meta name="description" content="Admin">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body class="bg-gray-900 text-white font-sans" style="visibility:hidden">
<div id="admin-page" data-active="users">
  <div class="mb-6"><h1 data-i18n="user_title" class="text-2xl md:text-3xl font-bold">Users</h1><p data-i18n="user_desc" class="text-gray-400 text-sm md:text-base mt-1">Monitor accounts.</p></div>
  <input type="search" id="search" placeholder="Tìm theo email hoặc tên…" class="w-full md:w-80 mb-4 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
  <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg w-full mb-4 overflow-hidden"><div class="overflow-x-auto">
    <table class="w-full min-w-[760px] text-left"><thead class="bg-gray-900/50 text-gray-400 text-xs uppercase tracking-wider"><tr>
      <th class="p-4 font-medium" data-i18n="th_user">User</th><th class="p-4 font-medium" data-i18n="th_plan">Plan</th><th class="p-4 font-medium">Ngày tạo</th><th class="p-4 font-medium" data-i18n="th_status">Status</th><th class="p-4 font-medium text-right" data-i18n="th_action">Actions</th></tr></thead>
    <tbody id="tbody" class="divide-y divide-gray-700/50"></tbody></table></div></div>
  <p class="text-xs text-gray-500">“Xóa hồ sơ” chỉ xóa dữ liệu trên Firestore. Để xóa hẳn tài khoản đăng nhập, vào Firebase Console → Authentication.</p>
</div>
<script src="lang.js"></script>
<script type="module">
import { adminReady } from './auth-guard.js';
import { db, collection, getDocs, doc, updateDoc, deleteDoc } from './firebase.js';
import { esc, safeUrl, dicebear, tsOf, fmtDate, toast, isAdminEmail, $ } from './common.js';
const me = await adminReady;

let users = [];
const tbody = $('#tbody');
async function load() {
  tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500 animate-pulse">Đang tải…</td></tr>';
  try { users = (await getDocs(collection(db, 'users'))).docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => tsOf(b.createdAt) - tsOf(a.createdAt)); render(); }
  catch (e) { console.error(e); tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-red-400">Lỗi kết nối máy chủ!</td></tr>'; }
}
function render() {
  const q = $('#search').value.trim().toLowerCase();
  const rows = users.filter((u) => !q || `${u.email} ${u.username}`.toLowerCase().includes(q));
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500">Không có người dùng.</td></tr>'; return; }
  tbody.innerHTML = rows.map((u) => {
    const banned = u.status === 'Banned', self = u.id === me.uid || isAdminEmail(u.email), prem = u.plan === 'Premium';
    const av = safeUrl(u.avatar, { data: true }) || dicebear(u.username || u.email);
    const actions = self ? '<span class="text-xs text-gray-600">Admin</span>' : `
      <button data-act="${banned ? 'unban' : 'ban'}" class="text-gray-300 ${banned ? 'hover:text-green-400' : 'hover:text-yellow-400'} px-2 py-1 text-sm">${banned ? 'Mở khóa' : 'Khóa'}</button>
      <button data-act="plan" class="text-gray-300 hover:text-purple-400 px-2 py-1 text-sm">${prem ? 'Hạ Free' : 'Lên Premium'}</button>
      <button data-act="delete" class="text-gray-300 hover:text-red-400 px-2 py-1 text-sm">Xóa hồ sơ</button>`;
    return `<tr data-id="${esc(u.id)}" class="hover:bg-gray-700/20"><td class="p-4"><div class="flex items-center gap-3 min-w-[220px]"><img src="${esc(av)}" alt="" class="w-9 h-9 rounded-full object-cover bg-gray-700"><div class="min-w-0"><p class="font-bold text-sm truncate">${esc(u.username || '—')}</p><p class="text-xs text-gray-400 truncate">${esc(u.email)}</p></div></div></td>
      <td class="p-4 text-sm font-bold ${prem ? 'text-purple-400' : 'text-gray-400'}">${esc(u.plan || 'Free')}</td><td class="p-4 text-xs text-gray-400 whitespace-nowrap">${esc(fmtDate(u.createdAt))}</td>
      <td class="p-4"><span class="px-2.5 py-1 border rounded-full text-xs font-bold ${banned ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-green-500/20 text-green-400 border-green-500/30'}">${banned ? 'Banned' : 'Active'}</span></td>
      <td class="p-4 text-right whitespace-nowrap">${actions}</td></tr>`;
  }).join('');
}
$('#search').addEventListener('input', render);
tbody.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('tr').dataset.id, u = users.find((x) => x.id === id), ref = doc(db, 'users', id), a = b.dataset.act;
  try {
    if (a === 'ban' || a === 'unban') { if (!confirm(`${a === 'ban' ? 'KHÓA' : 'MỞ KHÓA'} tài khoản ${u.email}?`)) return; await updateDoc(ref, { status: a === 'ban' ? 'Banned' : 'Active' }); }
    if (a === 'plan') await updateDoc(ref, { plan: u.plan === 'Premium' ? 'Free' : 'Premium' });
    if (a === 'delete') { if (!confirm(`Xóa hồ sơ ${u.email} khỏi Firestore?`)) return; await deleteDoc(ref); }
    toast('Đã cập nhật.', 'success'); load();
  } catch (err) { console.error(err); toast('Lỗi: ' + err.message, 'error'); }
});
load();
</script>
</body>
</html>
