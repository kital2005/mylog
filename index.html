    <script type="module">
        import { db, collection, getDocs, auth, doc, getDoc } from './firebase.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // ==========================================
        // 1. HỆ THỐNG NHẬN DIỆN VÀ CHẶN TÀI KHOẢN BỊ BAN
        // ==========================================
        onAuthStateChanged(auth, async (user) => {
            const authContainer = document.getElementById('header-auth');
            
            if (user) {
                try {
                    const usersSnap = await getDocs(collection(db, "users"));
                    let isBanned = false;
                    usersSnap.forEach(doc => {
                        if(doc.data().email === user.email && doc.data().status === 'Banned') {
                            isBanned = true;
                        }
                    });

                    if (isBanned) {
                        alert("SECURITY ALERT: Tài khoản của bạn đã bị Admin khóa vĩnh viễn!");
                        await signOut(auth); 
                        window.location.reload();
                        return; 
                    }
                } catch(error) { console.error(error); }

                const isAdmin = user.email === "thaituan.28012020@gmail.com";
                const adminLink = isAdmin 
                    ? `<a href="admin.html" class="text-xs font-bold text-purple-400 hover:text-purple-300 border border-purple-500/50 px-2 py-1 rounded transition-colors mr-2">Admin Panel</a>` 
                    : '';

                const userInitials = user.email.substring(0, 2).toUpperCase();

                authContainer.innerHTML = `
                    ${adminLink}
                    <div class="flex items-center gap-3">
                        <div title="${user.email}" class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center font-bold text-sm text-white shadow-lg cursor-pointer">
                            ${userInitials}
                        </div>
                        <button id="btn-logout-home" class="text-sm font-bold text-gray-400 hover:text-red-400 transition-colors">Logout</button>
                    </div>
                `;

                document.getElementById('btn-logout-home').addEventListener('click', () => {
                    signOut(auth).then(() => { window.location.reload(); });
                });

            } else {
                authContainer.innerHTML = `
                    <a href="auth.html" data-i18n="nav_login" class="text-sm font-semibold text-white bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-lg transition-colors shadow-lg shadow-blue-500/20">
                        Login
                    </a>
                `;
                if (typeof updateLanguage === 'function') updateLanguage();
            }
        });

        // ==========================================
        // 2. HỆ THỐNG CAROUSEL ĐỘNG (LẤY DỮ LIỆU TỪ FIREBASE)
        // ==========================================
        async function loadHeroConfig() {
            try {
                const docSnap = await getDoc(doc(db, "settings", "hero"));
                if (docSnap.exists()) {
                    const config = docSnap.data();
                    
                    const curLang = localStorage.getItem('site_language') || 'en';
                    document.getElementById('dynamic-hero-title').innerText = curLang === 'vn' ? config.titleVn : config.titleEn;
                    document.getElementById('dynamic-hero-desc').innerText = curLang === 'vn' ? config.descVn : config.descEn;

                    const slides = [config.slide1, config.slide2, config.slide3].filter(s => s); 
                    if(slides.length > 0) {
                        const bg1 = document.getElementById('carousel-bg-1');
                        const bg2 = document.getElementById('carousel-bg-2');
                        const bg3 = document.getElementById('carousel-bg-3');
                        const bgElements = [bg1, bg2, bg3];

                        slides.forEach((url, index) => {
                            if(bgElements[index]) bgElements[index].style.backgroundImage = `url('${url}')`;
                        });

                        if(slides.length > 1) {
                            let currentSlide = 0;
                            const interval = (config.interval || 5) * 1000;

                            setInterval(() => {
                                bgElements[currentSlide].classList.replace('opacity-100', 'opacity-0');
                                currentSlide = (currentSlide + 1) % slides.length; 
                                bgElements[currentSlide].classList.replace('opacity-0', 'opacity-100'); 
                            }, interval);
                        }
                    }
                }
            } catch (e) { console.error("Lỗi Carousel:", e); }
        }

        // ==========================================
        // 3. HỆ THỐNG TẢI SẢN PHẨM
        // ==========================================
        async function loadPublicProducts() {
            const container = document.getElementById('products-container');
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = ''; 

                if (querySnapshot.empty) {
                    container.innerHTML = '<p data-i18n="home_no_tools" class="col-span-full text-center text-gray-500">Currently no tools available.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();

                    const catI18n = data.category === 'Gaming' ? 'val_gaming' : (data.category === 'Graphics' ? 'val_graphics' : 'val_system');
                    
                    const descI18n = data.status === 'Active' ? 'tool_desc_active' : 'tool_desc_maintenance';
                    const defaultDesc = data.status === 'Active' ? 'Premium tool validated by CoreVault Security.' : 'Currently under maintenance.';
                    
                    let priceBadgeHTML = '';
                    if (data.price === 0) {
                        priceBadgeHTML = `<div class="absolute top-4 right-4 px-3 py-1 bg-green-500 text-white text-xs font-bold rounded-full shadow-lg" data-i18n="val_free">FREE</div>`;
                    } else {
                        priceBadgeHTML = `<div class="absolute top-4 right-4 px-3 py-1 bg-blue-600 text-white text-xs font-bold rounded-full shadow-lg" data-price-value="${data.price}"></div>`;
                    }

                    const card = document.createElement('div');
                    card.className = "group bg-gray-800/50 border border-gray-700 rounded-2xl overflow-hidden hover:border-blue-500/50 transition-all duration-300 hover:shadow-2xl hover:shadow-blue-500/10";
                    
                    card.innerHTML = `
                        <div class="h-48 bg-gray-700 flex items-center justify-center relative overflow-hidden text-6xl">
                            <div class="group-hover:scale-125 transition-transform duration-300">${data.icon}</div>
                            ${priceBadgeHTML}
                        </div>
                        <div class="p-6">
                            <h3 class="text-xl font-bold mb-2 group-hover:text-blue-400 transition-colors">${data.name}</h3>
                            <p data-i18n="${descI18n}" class="text-gray-400 text-sm mb-4 line-clamp-2 text-ellipsis overflow-hidden h-10">${defaultDesc}</p>
                            <div class="flex items-center justify-between">
                                <span data-i18n="${catI18n}" class="text-gray-500 text-xs uppercase font-bold tracking-widest">${data.category}</span>
                                <button data-i18n="btn_get_tool" class="text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg transition-all shadow-lg shadow-blue-500/20 hover:scale-105">Get Tool</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                if (typeof updateLanguage === 'function') updateLanguage();

            } catch (error) {
                console.error("Lỗi tải sản phẩm:", error);
                container.innerHTML = '<p class="col-span-full text-center text-red-500">Failed to connect to Firebase Server.</p>';
            }
        }

        // ==========================================
        // 4. CHẠY KHI TẢI TRANG XONG
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            loadHeroConfig(); // Mở Carousel lên
            loadPublicProducts(); // Tải kho sản phẩm
        });
    </script>
