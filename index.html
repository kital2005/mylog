<!DOCTYPE html>
<html lang="en">
<head>

<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<body class="bg-gray-900 text-white min-h-screen flex flex-col" data-page="home">
<div id="site-header"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-12 w-full flex-grow">

  <!-- HERO -->
  <section class="relative w-full h-[380px] md:h-[560px] rounded-3xl overflow-hidden shadow-2xl border border-gray-700 mb-14 group bg-gray-800">
    <div id="carousel-bg-1" class="absolute inset-0 bg-cover bg-center transition-all duration-700 opacity-100 group-hover:scale-105 group-hover:brightness-50 group-hover:blur-[3px]"></div>
    <div id="carousel-bg-2" class="absolute inset-0 bg-cover bg-center transition-all duration-700 opacity-0 group-hover:scale-105 group-hover:brightness-50 group-hover:blur-[3px]"></div>
    <div id="carousel-bg-3" class="absolute inset-0 bg-cover bg-center transition-all duration-700 opacity-0 group-hover:scale-105 group-hover:brightness-50 group-hover:blur-[3px]"></div>
    <div class="absolute inset-0 flex flex-col items-center justify-center p-6 md:p-10 text-center transition-all duration-700 bg-black/40 group-hover:bg-black/55">
      <h1 id="dynamic-hero-title" class="text-4xl md:text-7xl font-extrabold mb-5 text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] transition-all duration-500"></h1>
      <p id="dynamic-hero-desc" class="text-gray-100 text-base md:text-xl mb-8 max-w-3xl leading-relaxed drop-shadow-[0_3px_3px_rgba(0,0,0,0.8)] font-medium"></p>
      <a href="tools.html" data-i18n="hero_btn" class="px-7 md:px-9 py-3 bg-white hover:bg-gray-100 text-gray-900 transition-all duration-300 rounded-full font-bold shadow-[0_5px_15px_rgba(0,0,0,0.5)] hover:scale-105">Explore Now</a>
    </div>
    <div id="hero-dots" class="absolute bottom-4 left-0 right-0 flex justify-center gap-2 pointer-events-none"></div>
  </section>

  <!-- QUẢNG CÁO (chỉ hiện khi bật trong Admin) -->
  <div id="ad-container" class="w-full hidden mb-12">
    <div class="bg-gray-800/50 border border-gray-700 border-dashed rounded-2xl flex items-center justify-center p-8 text-center relative overflow-hidden">
      <span class="absolute top-2 right-3 text-[10px] text-gray-500 uppercase tracking-widest" data-i18n="ad_label">Advertisement</span>
      <p class="text-gray-500 text-sm">AdSense</p>
    </div>
  </div>

  <!-- CÔNG CỤ MỚI NHẤT -->
  <div class="flex items-end justify-between mb-8 w-full gap-4">
    <div>
      <h2 data-i18n="home_latest_title" class="text-2xl md:text-3xl font-bold text-white">Latest Tools</h2>
      <p data-i18n="home_latest_desc" class="text-gray-400 mt-1 text-sm md:text-base">Hand-picked premium & free resources for you.</p>
    </div>
    <a href="tools.html" data-i18n="home_view_all" class="text-blue-400 hover:text-blue-300 font-bold text-sm whitespace-nowrap transition-colors">View All →</a>
  </div>
  <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 w-full" aria-live="polite"></div>
</main>

<div id="site-footer"></div>

<script src="layout.js"></script>
<script src="lang.js"></script>
<script type="module">
import { db, doc, getDoc } from './firebase.js';
import { onUser, renderHeaderAuth, fetchPublicProducts, productCard, applyAds, safeUrl, lang, t, $ } from './common.js';

onUser((u, p) => renderHeaderAuth(p));
applyAds();

// ---------- HERO ----------
let heroCfg = null, heroTimer = null;
function renderHeroText() {
  const vn = lang() === 'vn', c = heroCfg || {};
  $('#dynamic-hero-title').textContent = (vn ? (c.titleVn || c.titleEn) : (c.titleEn || c.titleVn)) || t('hero_title');
  $('#dynamic-hero-desc').textContent = (vn ? (c.descVn || c.descEn) : (c.descEn || c.descVn)) || t('hero_desc');
}
async function loadHero() {
  renderHeroText();
  try {
    const s = await getDoc(doc(db, 'settings', 'hero'));
    if (!s.exists()) return;
    heroCfg = s.data(); renderHeroText();
    const slides = [heroCfg.slide1, heroCfg.slide2, heroCfg.slide3].map((u) => safeUrl(u)).filter(Boolean);
    const bgs = [1, 2, 3].map((i) => $('#carousel-bg-' + i));
    bgs.forEach((el, i) => { if (slides[i]) el.style.backgroundImage = `url(${JSON.stringify(slides[i])})`; else if (i > 0) el.remove(); });
    const dots = $('#hero-dots');
    if (slides.length > 1) {
      dots.innerHTML = slides.map((_, i) => `<span class="h-1.5 rounded-full transition-all ${i === 0 ? 'w-6 bg-white' : 'w-1.5 bg-white/50'}"></span>`).join('');
      let cur = 0;
      clearInterval(heroTimer);
      heroTimer = setInterval(() => {
        bgs[cur].classList.replace('opacity-100', 'opacity-0');
        cur = (cur + 1) % slides.length;
        bgs[cur].classList.replace('opacity-0', 'opacity-100');
        [...dots.children].forEach((d, i) => { d.className = `h-1.5 rounded-full transition-all ${i === cur ? 'w-6 bg-white' : 'w-1.5 bg-white/50'}`; });
      }, Math.max(2, Number(heroCfg.interval) || 5) * 1000);
    }
  } catch (e) { console.warn('hero:', e); }
}

// ---------- SẢN PHẨM ----------
const box = $('#products-container');
let latest = null;
const skeleton = () => { box.innerHTML = Array(3).fill('<div class="h-72 rounded-2xl bg-gray-800/60 border border-gray-700 animate-pulse"></div>').join(''); };
function renderProducts() {
  if (!latest) return;
  if (!latest.length) { box.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 font-medium" data-i18n="home_no_tools">No tools yet.</div>`; }
  else box.innerHTML = latest.map((p) => productCard(p.id, p)).join('');
  window.updateLanguage();
}
async function loadProducts() {
  skeleton();
  try { latest = (await fetchPublicProducts()).slice(0, 3); renderProducts(); }
  catch (e) {
    console.error(e);
    box.innerHTML = `<div class="col-span-full text-center py-12"><p class="text-red-400 mb-4" data-i18n="err_load">Could not load data.</p><button id="retry" data-i18n="btn_retry" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-lg font-bold">Retry</button></div>`;
    $('#retry').onclick = loadProducts; window.updateLanguage();
  }
}
document.addEventListener('languagechange', () => { renderHeroText(); renderProducts(); });
loadHero(); loadProducts();
</script>
</body>
</html>
