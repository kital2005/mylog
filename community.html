<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Community | CoreVault</title>
<meta name="description" content="Cộng đồng CoreVault: thảo luận công cụ, game và công nghệ.">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col" data-fab="off">
<nav class="sticky top-0 z-50 w-full bg-gray-900/80 backdrop-blur-md border-b border-gray-800">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2 hover:text-indigo-400 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg><span class="font-bold text-lg hidden md:block" data-i18n="back_hub">Back to Hub</span></a>
    <div class="flex items-center gap-3">
      <button onclick="toggleLanguage()" class="text-xs font-bold border border-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-800" data-i18n="lang_btn">EN / VN</button>
      <div id="header-auth" class="flex items-center gap-2"></div>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow flex flex-col md:flex-row gap-8">
  <aside class="w-full md:w-72 shrink-0">
    <div class="bg-gray-800 rounded-3xl p-5 border border-gray-700 shadow-xl md:sticky md:top-24">
      <div class="flex items-center justify-between mb-4">
        <h2 data-i18n="com_channels" class="text-sm font-bold text-gray-400 uppercase tracking-widest">Rooms</h2>
        <button id="btn-new-room" class="text-indigo-400 hover:text-indigo-300 text-sm font-bold bg-indigo-500/10 px-3 py-1 rounded-lg" data-i18n="com_create_room">+ New Room</button>
      </div>
      <div id="room-list" class="space-y-1 mb-5 max-h-[40vh] md:max-h-[50vh] overflow-y-auto pr-1 custom-scrollbar"></div>
      <button id="btn-join-room" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-xl text-sm transition-colors border border-gray-600" data-i18n="com_join_room">Join Private Room</button>
    </div>
  </aside>

  <div class="flex-grow min-w-0 flex flex-col gap-6">
    <div class="bg-gray-800 rounded-3xl p-5 border border-gray-700 shadow-xl">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-gray-700 gap-3">
        <h1 id="current-room-title" class="text-xl font-bold text-indigo-400 truncate"></h1>
        <span id="room-status-badge" class="text-xs font-bold px-3 py-1 rounded-full border whitespace-nowrap"></span>
      </div>
      <div class="flex gap-4">
        <img id="my-avatar" alt="" class="w-12 h-12 rounded-full border-2 border-indigo-500 object-cover shrink-0 bg-gray-900">
        <div class="flex-grow min-w-0">
          <textarea id="post-content" data-i18n="com_placeholder" maxlength="2000" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-2xl p-4 text-white focus:outline-none focus:border-indigo-500 transition-colors resize-none text-sm placeholder-gray-500"></textarea>
          <div class="flex items-center justify-between mt-3">
            <span id="post-count" class="text-xs text-gray-600">0/2000</span>
            <button id="btn-post" data-i18n="com_post_btn" class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-indigo-500/30 transition-transform hover:scale-105">Post</button>
          </div>
        </div>
      </div>
    </div>
    <div id="posts-container" class="space-y-6" aria-live="polite"></div>
    <button id="btn-more" class="hidden mx-auto bg-gray-800 hover:bg-gray-700 border border-gray-700 px-6 py-2.5 rounded-xl font-bold text-sm" data-i18n="com_show_more">Show more</button>
  </div>
</main>

<!-- MODAL TẠO / VÀO PHÒNG -->
<div id="room-modal" class="fixed inset-0 bg-black/80 z-[60] hidden items-center justify-center p-4 backdrop-blur-sm" role="dialog" aria-modal="true">
  <form id="room-form" class="bg-gray-800 border border-gray-700 rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
    <h3 id="room-modal-title" class="text-xl font-bold"></h3>
    <input id="rm-name" required maxlength="30" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500" data-i18n="com_room_name">
    <label id="rm-private-wrap" class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer"><input type="checkbox" id="rm-private" class="rounded bg-gray-900"> <span data-i18n="com_room_private">Password-protect this room</span></label>
    <input id="rm-key" type="text" maxlength="40" autocomplete="off" class="hidden w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500" data-i18n="com_room_key">
    <div class="flex gap-3 pt-2">
      <button type="button" id="rm-cancel" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-sm" data-i18n="btn_cancel">Cancel</button>
      <button type="submit" id="rm-ok" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold text-sm"></button>
    </div>
  </form>
</div>

<script src="lang.js"></script>
<script type="module">
import { db, collection, addDoc, getDocs, doc, getDoc, updateDoc, deleteDoc, query, where, orderBy, onSnapshot, arrayUnion, arrayRemove, writeBatch } from './firebase.js';
import { onUser, renderHeaderAuth, esc, safeUrl, fmtDate, tsOf, toast, t, $, sha256, checkMaintenance, getAdminUids, isAdminAuthor, makeThumb, linkify } from './common.js';

const GENERAL = { id: 'general', name: '🌐 General Chat', creator: 'system', isPrivate: false };
let me = null, adminUids = [], room = GENERAL, rooms = [], posts = [], unsub = null, shown = 30, lastPost = 0;
const joined = new Set(JSON.parse(localStorage.getItem('cv_joined_rooms') || '[]'));
const saveJoined = () => localStorage.setItem('cv_joined_rooms', JSON.stringify([...joined]));

onUser(async (u, p) => {
  if (await checkMaintenance('communityLocked', p)) return;
  me = p; me.thumb = await makeThumb(p.avatar, 64);
  adminUids = await getAdminUids();
  renderHeaderAuth(p, { ring: p.isAdmin ? 'border-red-500' : 'border-indigo-500' });
  $('#my-avatar').src = p.avatar;
  await loadRooms(); openRoom(GENERAL);
}, { require: true });

// ---------- PHÒNG ----------
async function loadRooms() {
  try {
    const snap = await getDocs(query(collection(db, 'rooms'), orderBy('timestamp', 'desc')));
    rooms = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (e) { console.error(e); rooms = []; }
  renderRooms();
}
const canSeeRoom = (r) => !r.isPrivate || r.createdBy === me.uid || me.isAdmin || joined.has(r.id);
const canManageRoom = (r) => me.isAdmin || r.createdBy === me.uid;
function renderRooms() {
  const item = (id, label, active, del) => `<div class="flex items-center gap-1"><button data-room="${esc(id)}" class="flex-grow min-w-0 text-left px-4 py-2.5 rounded-xl truncate transition-colors ${active ? 'bg-indigo-600/20 text-indigo-300 font-bold border border-indigo-500/30' : 'text-gray-300 hover:bg-gray-700 font-medium border border-transparent'}">${label}</button>${del}</div>`;
  let html = item('general', `<span data-i18n="com_general">${esc(GENERAL.name)}</span>`, room.id === 'general', '');
  rooms.filter(canSeeRoom).forEach((r) => {
    const del = canManageRoom(r) ? `<button data-delroom="${esc(r.id)}" class="text-red-500 hover:text-red-400 hover:bg-red-500/20 p-2 rounded-lg" aria-label="Delete">🗑</button>` : '';
    html += item(r.id, `${r.isPrivate ? '🔒' : '💬'} ${esc(r.name)}`, room.id === r.id, del);
  });
  $('#room-list').innerHTML = html; window.updateLanguage();
}
$('#room-list').addEventListener('click', async (e) => {
  const d = e.target.closest('[data-delroom]'), s = e.target.closest('[data-room]');
  if (d) return delRoom(d.dataset.delroom);
  if (s) { const r = s.dataset.room === 'general' ? GENERAL : rooms.find((x) => x.id === s.dataset.room); if (r) openRoom({ id: r.id, name: r.id === 'general' ? r.name : (r.isPrivate ? '🔒 ' : '💬 ') + r.name, creator: r.creator || r.createdBy, isPrivate: !!r.isPrivate }); }
});
async function delRoom(id) {
  if (!confirm(t('com_confirm_del_room'))) return;
  try {
    const ps = await getDocs(query(collection(db, 'posts'), where('roomId', '==', id)));
    for (let i = 0; i < ps.docs.length; i += 400) { const b = writeBatch(db); ps.docs.slice(i, i + 400).forEach((d) => b.delete(d.ref)); await b.commit(); }
    await deleteDoc(doc(db, 'rooms', id)); joined.delete(id); saveJoined();
    if (room.id === id) openRoom(GENERAL);
    await loadRooms();
  } catch (e) { console.error(e); toast(t('err_generic'), 'error'); }
}

// Modal tạo / vào phòng
const modal = $('#room-modal'); let modalMode = 'create';
function openModal(mode) {
  modalMode = mode; $('#room-form').reset();
  const create = mode === 'create';
  $('#room-modal-title').textContent = t(create ? 'com_create_room_title' : 'com_join_title');
  $('#rm-ok').textContent = t(create ? 'com_create' : 'com_join');
  $('#rm-private-wrap').classList.toggle('hidden', !create);
  const key = $('#rm-key'); key.classList.toggle('hidden', create); key.required = !create;
  modal.classList.remove('hidden'); modal.classList.add('flex'); $('#rm-name').focus(); window.updateLanguage();
}
const closeModal = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };
$('#btn-new-room').onclick = () => openModal('create');
$('#btn-join-room').onclick = () => openModal('join');
$('#rm-cancel').onclick = closeModal;
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
$('#rm-private').addEventListener('change', (e) => { const k = $('#rm-key'); k.classList.toggle('hidden', !e.target.checked); k.required = e.target.checked; });
$('#room-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('#rm-name').value.trim(), key = $('#rm-key').value.trim(), btn = $('#rm-ok');
  if (!name) return;
  btn.disabled = true;
  try {
    if (modalMode === 'create') {
      const priv = $('#rm-private').checked;
      if (priv && key.length < 4) { toast(t('com_key_short'), 'warn'); btn.disabled = false; return; }
      const data = { name, isPrivate: priv, createdBy: me.uid, timestamp: Date.now() };
      if (priv) data.keyHash = await sha256(key);
      const ref = await addDoc(collection(db, 'rooms'), data);
      closeModal(); await loadRooms();
      openRoom({ id: ref.id, name: (priv ? '🔒 ' : '💬 ') + name, creator: me.uid, isPrivate: priv });
    } else {
      const snap = await getDocs(query(collection(db, 'rooms'), where('name', '==', name)));
      const h = await sha256(key);
      const hit = snap.docs.find((d) => d.data().isPrivate && (d.data().keyHash === h || d.data().key === key));
      if (!hit) { toast(t('com_bad_room'), 'error'); btn.disabled = false; return; }
      joined.add(hit.id); saveJoined(); closeModal(); await loadRooms();
      openRoom({ id: hit.id, name: '🔒 ' + hit.data().name, creator: hit.data().createdBy, isPrivate: true });
    }
  } catch (err) { console.error(err); toast(t('err_generic'), 'error'); }
  btn.disabled = false;
});

// ---------- BÀI VIẾT (realtime) ----------
function openRoom(r) {
  room = r; shown = 30;
  $('#current-room-title').textContent = r.name;
  const b = $('#room-status-badge');
  b.textContent = t(r.isPrivate ? 'com_private' : 'com_public');
  b.className = `text-xs font-bold px-3 py-1 rounded-full border whitespace-nowrap ${r.isPrivate ? 'bg-rose-500/20 text-rose-400 border-rose-500/30' : 'bg-green-500/20 text-green-400 border-green-500/30'}`;
  renderRooms();
  if (unsub) unsub();
  $('#posts-container').innerHTML = '<div class="h-32 rounded-3xl bg-gray-800/60 border border-gray-700 animate-pulse"></div>';
  unsub = onSnapshot(query(collection(db, 'posts'), where('roomId', '==', r.id)),
    (snap) => { posts = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => tsOf(b.timestamp) - tsOf(a.timestamp)); renderPosts(); },
    (err) => { console.error(err); $('#posts-container').innerHTML = `<p class="text-red-400 text-center font-bold">${esc(t('err_load'))}</p>`; });
}

const badge = (admin, small) => admin ? `<span class="bg-red-600 text-white ${small ? 'text-[9px] px-1.5' : 'text-[10px] px-2'} py-0.5 rounded border border-red-500/50 ml-2 tracking-widest">ADMIN</span>` : '';
function replyHTML(r) {
  const adm = isAdminAuthor(r, adminUids);
  return `<div class="flex gap-3 bg-gray-900/80 p-3 rounded-xl border border-gray-700/50 mt-2">
    <img src="${esc(safeUrl(r.avatar, { data: true }) || 'logo.svg')}" alt="" class="w-8 h-8 rounded-full border ${adm ? 'border-red-500' : 'border-gray-600'} shrink-0 object-cover bg-gray-800">
    <div class="min-w-0 flex-grow"><div class="flex items-center mb-1 flex-wrap"><p class="text-xs ${adm ? 'text-red-400 font-extrabold' : 'text-indigo-300 font-bold'}">${esc(r.name)}</p>${badge(adm, true)}${r.uid === room.creator && room.creator !== 'system' ? '<span class="text-yellow-500 text-[10px] ml-1">👑</span>' : ''}<span class="text-[10px] text-gray-600 ml-2">${esc(fmtDate(r.timestamp))}</span></div>
    <p class="text-sm text-gray-300 leading-relaxed break-words whitespace-pre-line">${linkify(r.text)}</p></div></div>`;
}
function postHTML(p) {
  const adm = isAdminAuthor(p, adminUids), likes = p.likes || [], replies = p.replies || [];
  const liked = likes.includes(me.uid);
  const canDel = me.isAdmin || p.uid === me.uid || (room.creator === me.uid && room.id !== 'general');
  return `<article data-id="${esc(p.id)}" class="bg-gray-800 rounded-3xl p-5 md:p-6 border ${adm ? 'border-red-500/30 shadow-[0_0_20px_rgba(239,68,68,0.1)]' : 'border-gray-700 shadow-xl'}">
    <div class="flex justify-between items-start mb-4 gap-3">
      <div class="flex items-center gap-3 min-w-0"><img src="${esc(safeUrl(p.authorAvatar, { data: true }) || 'logo.svg')}" alt="" class="w-12 h-12 rounded-full border-2 ${adm ? 'border-red-500' : 'border-gray-600'} object-cover bg-gray-900 shrink-0">
        <div class="min-w-0"><h3 class="${adm ? 'text-red-400 font-extrabold' : 'text-white font-bold'} flex items-center flex-wrap">${esc(p.authorName)}${badge(adm)}${p.uid === room.creator && room.creator !== 'system' ? '<span class="bg-yellow-500/20 text-yellow-500 text-[10px] px-2 py-0.5 rounded-md border border-yellow-500/30 ml-2">👑 <span data-i18n="com_host">Host</span></span>' : ''}</h3><p class="text-xs text-gray-500">${esc(fmtDate(p.timestamp))}</p></div></div>
      ${canDel ? `<button data-act="del" class="text-red-500 hover:text-white hover:bg-red-600 text-xs font-bold px-3 py-1.5 rounded-lg border border-red-500/30 transition-colors shrink-0" data-i18n="com_delete">Delete</button>` : ''}
    </div>
    <p class="text-gray-100 text-sm md:text-base whitespace-pre-line break-words leading-relaxed mb-4">${linkify(p.content)}</p>
    <div class="flex items-center gap-6 border-y border-gray-700 py-3 mb-4 text-sm">
      <button data-act="like" class="flex items-center gap-2 ${liked ? 'text-rose-500' : 'text-gray-400'} hover:text-rose-500 transition-colors font-bold">${liked ? '❤️' : '🤍'} <span data-i18n="com_like">Like</span> <span class="bg-gray-900 px-2 py-0.5 rounded-md text-xs">${likes.length}</span></button>
      <span class="flex items-center gap-2 text-gray-400 font-bold">💬 <span data-i18n="com_reply">Reply</span> <span class="bg-gray-900 px-2 py-0.5 rounded-md text-xs">${replies.length}</span></span>
    </div>
    ${replies.length ? `<div class="mb-4 bg-gray-900/50 p-3 rounded-2xl border border-gray-700/50">${replies.map(replyHTML).join('')}</div>` : ''}
    <div class="relative"><input type="text" data-reply maxlength="500" data-i18n="com_write_reply" class="w-full bg-gray-900 border border-gray-700 rounded-full pl-4 pr-20 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
      <button data-act="reply" class="absolute right-1.5 top-1.5 bg-indigo-600 hover:bg-indigo-500 px-4 py-1.5 rounded-full text-white font-bold text-xs transition-colors" data-i18n="btn_send">Send</button></div>
  </article>`;
}
function renderPosts() {
  const box = $('#posts-container');
  // giữ lại nội dung đang gõ dở khi có bài mới tới
  const drafts = {}; let focusId = null;
  box.querySelectorAll('article').forEach((a) => { const i = a.querySelector('[data-reply]'); if (i.value) drafts[a.dataset.id] = i.value; if (document.activeElement === i) focusId = a.dataset.id; });
  if (!posts.length) { box.innerHTML = `<div class="text-center py-16 bg-gray-800/30 rounded-3xl border border-gray-700 border-dashed"><p class="text-gray-500 font-medium" data-i18n="com_empty">Nobody has posted here yet. Be the first!</p></div>`; $('#btn-more').classList.add('hidden'); return window.updateLanguage(); }
  box.innerHTML = posts.slice(0, shown).map(postHTML).join('');
  $('#btn-more').classList.toggle('hidden', posts.length <= shown);
  window.updateLanguage();
  box.querySelectorAll('article').forEach((a) => { const i = a.querySelector('[data-reply]'); if (drafts[a.dataset.id]) i.value = drafts[a.dataset.id]; if (a.dataset.id === focusId) i.focus(); });
}
$('#btn-more').onclick = () => { shown += 30; renderPosts(); };

$('#posts-container').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const art = btn.closest('article'), id = art.dataset.id, ref = doc(db, 'posts', id), post = posts.find((p) => p.id === id);
  try {
    if (btn.dataset.act === 'like') await updateDoc(ref, { likes: (post.likes || []).includes(me.uid) ? arrayRemove(me.uid) : arrayUnion(me.uid) });
    else if (btn.dataset.act === 'del') { if (confirm(t('com_confirm_del_post'))) await deleteDoc(ref); }
    else if (btn.dataset.act === 'reply') await sendReply(art, ref, post);
  } catch (err) { console.error(err); toast(t('err_perm'), 'error'); }
});
$('#posts-container').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('[data-reply]')) { e.preventDefault(); e.target.closest('article').querySelector('[data-act="reply"]').click(); } });
async function sendReply(art, ref, post) {
  const input = art.querySelector('[data-reply]'), text = input.value.trim();
  if (!text) return;
  if ((post.replies || []).length >= 100) return toast(t('com_reply_limit'), 'warn');
  await updateDoc(ref, { replies: arrayUnion({ uid: me.uid, name: me.username, avatar: me.thumb, text, timestamp: Date.now() }) });
  input.value = '';
}

// ---------- ĐĂNG BÀI ----------
$('#post-content').addEventListener('input', (e) => { $('#post-count').textContent = `${e.target.value.length}/2000`; });
$('#post-content').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#btn-post').click(); });
$('#btn-post').onclick = async () => {
  const el = $('#post-content'), content = el.value.trim();
  if (!content) return;
  if (Date.now() - lastPost < 3000) return toast(t('com_wait'), 'warn');
  const btn = $('#btn-post'); btn.disabled = true;
  try {
    await addDoc(collection(db, 'posts'), { roomId: room.id, uid: me.uid, authorName: me.username, authorAvatar: me.thumb, isAdmin: me.isAdmin, content, likes: [], replies: [], timestamp: Date.now() });
    el.value = ''; $('#post-count').textContent = '0/2000'; lastPost = Date.now();
  } catch (err) { console.error(err); toast(t('err_perm'), 'error'); }
  btn.disabled = false;
};
document.addEventListener('languagechange', () => { if (me) { $('#room-status-badge').textContent = t(room.isPrivate ? 'com_private' : 'com_public'); renderRooms(); renderPosts(); } });
</script>
</body>
</html>
