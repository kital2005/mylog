<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OS & Resources | CoreVault</title>
<meta name="description" content="Kho bản Windows tùy chỉnh và công cụ tối ưu hệ thống.">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col" data-fab="off">
<nav class="sticky top-0 z-50 w-full bg-gray-900/80 backdrop-blur-md border-b border-gray-800">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <a href="index.html" class="flex items-center gap-2 hover:text-emerald-400 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg><span class="font-bold text-lg hidden md:block" data-i18n="back_hub">Back to Hub</span></a>
    <div class="flex items-center gap-3">
      <button onclick="toggleLanguage()" class="text-xs font-bold border border-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-800" data-i18n="lang_btn">EN / VN</button>
      <button id="btn-share" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-sm font-bold shadow-lg shadow-emerald-500/30 transition-all">＋ <span data-i18n="res_upload_btn">Share File</span></button>
      <div id="header-auth" class="flex items-center gap-2"></div>
    </div>
  </div>
</nav>

<main class="max-w-4xl mx-auto px-4 sm:px-6 py-10 w-full flex-grow">
  <div class="mb-8 text-center md:text-left">
    <h1 data-i18n="res_title" class="text-4xl font-extrabold mb-3 tracking-tight">OS & Tweaks</h1>
    <p data-i18n="res_desc" class="text-gray-400">Exclusive custom OS builds and system optimizers.</p>
  </div>
  <input type="search" id="q" data-i18n="res_search" class="w-full mb-6 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500" autocomplete="off">
  <div id="res-list" class="space-y-5" aria-live="polite"></div>
</main>

<div id="upload-modal" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-4 backdrop-blur-md" role="dialog" aria-modal="true">
  <div class="bg-gray-900 border border-gray-700 rounded-3xl p-6 md:p-8 w-full max-w-md shadow-2xl relative">
    <button type="button" id="m-close" aria-label="Close" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-gray-800 w-9 h-9 rounded-full">✕</button>
    <h2 class="text-2xl font-extrabold mb-2 text-center" data-i18n="res_modal_title">Share to Cloud</h2>
    <p class="text-center text-gray-400 text-sm mb-6" data-i18n="res_modal_desc">Paste your Drive, Fshare or MediaFire link.</p>
    <form id="res-form" class="space-y-4">
      <input type="text" id="rTitle" required maxlength="120" data-i18n="res_ph_title" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500">
      <input type="text" id="rSize" maxlength="20" data-i18n="res_ph_size" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500">
      <textarea id="rDesc" rows="3" maxlength="1000" data-i18n="res_ph_desc" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 resize-none"></textarea>
      <input type="url" id="rLink" required placeholder="https://…" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500">
      <div class="flex gap-3 pt-3">
        <button type="button" id="m-cancel" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-bold text-gray-300" data-i18n="btn_cancel">Cancel</button>
        <button type="submit" id="m-ok" class="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-60 py-3 rounded-xl font-bold shadow-lg shadow-emerald-500/30" data-i18n="btn_publish">Publish</button>
      </div>
    </form>
  </div>
</div>

<script src="lang.js"></script>
<script type="module">
import { db, collection, addDoc, getDocs, doc, deleteDoc, query, orderBy, limit } from './firebase.js';
import { onUser, renderHeaderAuth, esc, safeUrl, fmtDate, toast, t, $, checkMaintenance, getAdminUids, isAdminAuthor, makeThumb, linkify } from './common.js';

let me = null, adminUids = [], items = null;
const list = $('#res-list');

onUser(async (u, p) => {
  if (await checkMaintenance('resourcesLocked', p)) return;
  me = p; me.thumb = await makeThumb(p.avatar, 64); adminUids = await getAdminUids();
  renderHeaderAuth(p, { ring: p.isAdmin ? 'border-red-500' : 'border-emerald-500' });
  load();
}, { require: true });

async function load() {
  list.innerHTML = '<div class="h-40 rounded-3xl bg-gray-800/60 border border-gray-700 animate-pulse"></div>';
  try {
    const snap = await getDocs(query(collection(db, 'resources'), orderBy('timestamp', 'desc'), limit(100)));
    items = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render();
  } catch (e) { console.error(e); list.innerHTML = `<p class="text-center text-red-400 font-bold">${esc(t('err_load'))}</p>`; }
}
function render() {
  if (!items) return;
  const q = $('#q').value.trim().toLowerCase();
  const rows = items.filter((d) => !q || `${d.title} ${d.desc} ${d.authorName}`.toLowerCase().includes(q));
  if (!rows.length) { list.innerHTML = `<p class="text-center text-gray-500 font-bold py-10" data-i18n="res_empty">No files shared yet.</p>`; return window.updateLanguage(); }
  list.innerHTML = rows.map((d) => {
    const url = safeUrl(d.url); if (!url) return '';
    const adm = isAdminAuthor(d, adminUids), canDel = me.isAdmin || me.uid === d.uid;
    return `<article data-id="${esc(d.id)}" class="bg-gray-800 rounded-3xl p-5 md:p-6 border ${adm ? 'border-red-500/30 shadow-[0_0_20px_rgba(239,68,68,0.15)]' : 'border-gray-700 shadow-xl'} hover:border-emerald-500/50 transition-all">
      <div class="flex items-start gap-4 md:gap-5">
        <div class="w-12 h-12 md:w-14 md:h-14 bg-gray-900 rounded-2xl border border-gray-600 flex items-center justify-center shrink-0 text-2xl">💾</div>
        <div class="flex-grow min-w-0">
          <div class="flex justify-between items-start gap-3"><h3 class="text-lg md:text-xl font-extrabold break-words">${esc(d.title)}</h3><span class="bg-gray-900 text-emerald-400 font-mono text-xs px-3 py-1 rounded-full border border-gray-700 shrink-0">${esc(d.size || 'ZIP')}</span></div>
          <p class="text-gray-400 text-sm my-3 leading-relaxed whitespace-pre-line break-words">${d.desc ? linkify(d.desc) : `<span data-i18n="res_no_desc">No description.</span>`}</p>
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-t border-gray-700/50 pt-4">
            <div class="flex items-center gap-3 min-w-0"><img src="${esc(safeUrl(d.authorAvatar, { data: true }) || 'logo.svg')}" alt="" class="w-8 h-8 rounded-full object-cover border-2 ${adm ? 'border-red-500' : 'border-gray-600'}">
              <span class="text-xs text-gray-400 truncate"><span data-i18n="res_by">Shared by</span> <b class="${adm ? 'text-red-400' : 'text-gray-200'}">${esc(d.authorName)}</b>${adm ? ' <span class="bg-red-600 text-white text-[9px] px-1.5 py-0.5 rounded">ADMIN</span>' : ''} · ${esc(fmtDate(d.timestamp))}</span></div>
            <div class="flex items-center gap-3"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer nofollow" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-emerald-500/20" data-i18n="btn_dl_now">Download</a>
              ${canDel ? `<button data-del class="text-red-500 hover:text-white hover:bg-red-600 text-xs font-bold px-3 py-2 rounded-lg border border-red-500/30 transition-colors" data-i18n="com_delete">Delete</button>` : ''}</div>
          </div></div></div></article>`;
  }).join('');
  window.updateLanguage();
}
$('#q').addEventListener('input', render);
list.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-del]'); if (!b || !confirm(t('res_confirm_del'))) return;
  try { await deleteDoc(doc(db, 'resources', b.closest('article').dataset.id)); load(); } catch (err) { toast(t('err_perm'), 'error'); }
});

const modal = $('#upload-modal');
const open = () => { modal.classList.remove('hidden'); modal.classList.add('flex'); $('#rTitle').focus(); window.updateLanguage(); };
const close = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };
$('#btn-share').onclick = open; $('#m-close').onclick = close; $('#m-cancel').onclick = close;
modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
$('#res-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = safeUrl($('#rLink').value); if (!url) return toast(t('err_url'), 'error');
  const btn = $('#m-ok'); btn.disabled = true;
  try {
    await addDoc(collection(db, 'resources'), { uid: me.uid, authorName: me.username, authorAvatar: me.thumb, isAdmin: me.isAdmin, title: $('#rTitle').value.trim(), size: $('#rSize').value.trim(), desc: $('#rDesc').value.trim(), url, timestamp: Date.now() });
    e.target.reset(); close(); toast(t('msg_published'), 'success'); load();
  } catch (err) { console.error(err); toast(t('err_perm'), 'error'); }
  btn.disabled = false;
});
document.addEventListener('languagechange', render);
</script>
</body>
</html>
