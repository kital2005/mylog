<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body class="bg-gray-900 text-white font-sans flex h-screen overflow-hidden" style="display: none;">

        <a href="index.html" title="Về Trang Chủ" class="h-16 flex items-center px-6 border-b border-gray-700 hover:bg-gray-700/50 transition-colors cursor-pointer">

        </a>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="admin.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span data-i18n="admin_dashboard">Dashboard</span>

            <a href="admin-products.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-600/30 font-medium transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                <span data-i18n="admin_products">Products</span>
            </a>
            <a href="admin-users.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span data-i18n="admin_users">Users</span>
            </a>
            <a href="admin-orders.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span data-i18n="admin_orders">Orders</span>
            </a>
<a href="admin-settings.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>

                <span data-i18n="admin_settings">Settings</span>

    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-8">
            <div class="relative w-64">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                    <svg class="w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </span>
                <input type="text" data-i18n="admin_search" class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-blue-500 transition-colors text-sm" placeholder="Search...">
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleLanguage()" class="text-gray-300 hover:text-white px-3 py-1.5 text-sm font-medium border border-gray-700 hover:border-gray-500 hover:bg-gray-800 rounded-lg transition-all flex items-center gap-1">
                    <span data-i18n="lang_btn">EN / VN</span>
                </button>
                <button class="text-gray-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg></button>
                <div onclick="logoutAdmin()" title="Đăng Xuất (Logout)" class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center font-bold text-sm shadow-lg cursor-pointer hover:scale-110 transition-transform">LR</div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
                <div>
                    <h1 data-i18n="prod_title" class="text-3xl font-bold text-white">Products Vault</h1>
                    <p data-i18n="prod_desc" class="text-gray-400 mt-1">Manage your tools, updates, pricing, and downloads.</p>
                </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all shadow-lg shadow-blue-500/30">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span data-i18n="prod_add">Add New Tool</span>
            </button>
            </div>

            <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden shadow-lg">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900/50 text-gray-400 text-xs uppercase tracking-wider">
                            <th data-i18n="prod_th_info" class="p-4 font-medium">Product Info</th>
                            <th data-i18n="prod_th_cat" class="p-4 font-medium">Category</th>
                            <th data-i18n="prod_th_price" class="p-4 font-medium">Price</th>
                            <th data-i18n="prod_th_status" class="p-4 font-medium">Status</th>
                            <th data-i18n="prod_th_action" class="p-4 font-medium text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-700/50">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="addToolModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div class="bg-gray-800 border border-gray-700 rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-8 shadow-2xl relative transform scale-95 transition-transform duration-300" id="modalContent">
            
            <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                <h3 data-i18n="prod_add" id="modalTitle" class="text-2xl font-bold text-white">Add New Tool</h3>
                <button type="button" onclick="closeModal()" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="addToolForm" onsubmit="saveTool(event)">
                <input type="hidden" id="toolId" value="">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                    <div>
                        <label data-i18n="modal_name" class="block text-sm font-medium text-gray-400 mb-1">Product Name *</label>
                        <input type="text" id="toolName" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label data-i18n="modal_cat" class="block text-sm font-medium text-gray-400 mb-1">Category *</label>
                        <select id="toolCat" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                            <option value="Gaming">Gaming</option>
                            <option value="Graphics">Graphics</option>
                            <option value="System">System</option>
                        </select>
                    </div>
                    <div>
                        <label data-i18n="modal_price" class="block text-sm font-medium text-gray-400 mb-1">Price * (0 for Free)</label>
                        <input type="number" id="toolPrice" step="0.01" min="0" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. 15.00">
                    </div>
                    <div>
                        <label data-i18n="modal_status" class="block text-sm font-medium text-gray-400 mb-1">Status *</label>
                        <select id="toolStatus" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                            <option value="Active">Active</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="Hidden">Hidden</option>
                        </select>
                    </div>
                </div>

                <div class="mb-5">
                    <label data-i18n="modal_desc" class="block text-sm font-medium text-gray-400 mb-1">Description</label>
                    <textarea id="toolDesc" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 placeholder-gray-600" placeholder="..."></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 p-5 bg-gray-900/50 rounded-xl border border-gray-700/50">
                    <div>
                        <label data-i18n="modal_icon" class="block text-xs font-bold text-gray-400 mb-2">Icon (Optional)</label>
                        <input type="file" id="toolIcon" accept="image/*" class="block w-full text-xs text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-gray-700 file:text-white hover:file:bg-gray-600 cursor-pointer transition-colors">
                    </div>
                    <div>
                        <label data-i18n="modal_file" class="block text-xs font-bold text-gray-400 mb-2">File .zip (Optional)</label>
                        <input type="file" id="toolFile" accept=".zip,.rar,.exe" class="block w-full text-xs text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-gray-700 file:text-white hover:file:bg-gray-600 cursor-pointer transition-colors">
                    </div>
                    <div>
                        <label data-i18n="modal_video" class="block text-xs font-bold text-gray-400 mb-2">Demo Video (Optional)</label>
                        <input type="file" id="toolVideo" accept="video/*" class="block w-full text-xs text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-gray-700 file:text-white hover:file:bg-gray-600 cursor-pointer transition-colors">
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-5 border-t border-gray-700">
                    <button type="button" onclick="closeModal()" data-i18n="modal_btn_cancel" class="px-5 py-2.5 text-sm font-bold text-gray-400 hover:text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl transition-colors">Cancel</button>
                    <button type="submit" data-i18n="modal_btn_save" class="px-6 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 rounded-xl shadow-lg shadow-blue-500/30 transition-all">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="lang.js"></script>
    <script type="module" src="auth-guard.js"></script>

    <script type="module">
        // Nhập đồ nghề Database (Đã bổ sung doc, updateDoc, deleteDoc)
        import { db, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from './firebase.js';

        // Biến toàn cục để lưu trữ tạm thời dữ liệu đang hiển thị trên bảng
        let currentToolsData = {};

        // 1. Mở Modal
        window.openModal = function() {
            const modal = document.getElementById('addToolModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
            updateLanguage(); 
        };

        // 2. Đóng Modal
        window.closeModal = function() {
            const modal = document.getElementById('addToolModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('addToolForm').reset(); 
                document.getElementById('toolId').value = ''; // Xóa sạch ID ẩn đi
            }, 300);
        };

        // 3. Tải dữ liệu từ máy chủ
        window.loadProducts = async function() {
            const tbody = document.querySelector('tbody');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500 animate-pulse">Đang tải dữ liệu từ máy chủ...</td></tr>';

            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                tbody.innerHTML = ''; 
                currentToolsData = {}; // Xóa bộ nhớ tạm cũ

                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500">Kho sản phẩm trống. Hãy thêm công cụ mới!</td></tr>';
                    return;
                }

                querySnapshot.forEach((documentSnapshot) => {
                    const data = documentSnapshot.data();
                    const docId = documentSnapshot.id; // Lấy ID ĐỘC NHẤT của món hàng
                    
                    // Lưu dữ liệu vào bộ nhớ tạm để lát nữa bấm Edit rút ra cho lẹ
                    currentToolsData[docId] = data;

                    const newRow = document.createElement('tr');
                    newRow.className = "hover:bg-gray-700/20 transition-colors group";
                    
                    const catI18n = data.category === 'Gaming' ? 'val_gaming' : (data.category === 'Graphics' ? 'val_graphics' : 'val_system');
                    const statusI18n = data.status === 'Active' ? 'val_active' : (data.status === 'Maintenance' ? 'val_maintenance' : 'val_hidden');

                    let priceDisplay = data.price === 0 
                        ? '<span data-i18n="val_free" class="text-green-400 font-bold text-sm">FREE</span>' 
                        : `<span data-price-value="${data.price}" class="text-white font-bold text-sm"></span>`;

                    let statusDisplay = data.status === 'Active' 
                        ? `<span data-i18n="${statusI18n}" class="px-2.5 py-1 bg-green-500/20 text-green-400 border border-green-500/30 rounded-full text-xs font-bold">Active</span>` 
                        : `<span data-i18n="${statusI18n}" class="px-2.5 py-1 bg-yellow-500/20 text-yellow-500 border border-yellow-500/30 rounded-full text-xs font-bold">${data.status}</span>`;

                    newRow.innerHTML = `
                        <td class="p-4 flex items-center gap-4">
                            <div class="w-12 h-12 rounded-lg bg-gray-700 flex items-center justify-center text-xl">${data.icon}</div>
                            <div><p class="text-white font-bold text-sm">${data.name}</p></div>
                        </td>
                        <td class="p-4"><span data-i18n="${catI18n}" class="text-gray-300 text-sm">${data.category}</span></td>
                        <td class="p-4">${priceDisplay}</td>
                        <td class="p-4">${statusDisplay}</td>
                        <td class="p-4 text-right space-x-3">
                            <button onclick="editTool('${docId}')" data-i18n="btn_edit" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Edit</button>
                            <button onclick="deleteTool('${docId}')" data-i18n="btn_delete" class="text-red-400 hover:text-red-300 font-medium transition-colors">Delete</button>
                        </td>
                    `;
                    
                    tbody.prepend(newRow); 
                });

                if (typeof updateLanguage === 'function') updateLanguage();

            } catch (error) {
                console.error("Lỗi:", error);
                tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-red-500">Lỗi kết nối máy chủ!</td></tr>';
            }
        };

        // 4. Lưu Sản Phẩm (Bao gồm cả Tạo mới và Sửa lỗi)
        window.saveTool = async function(e) {
            e.preventDefault(); 
            
            const toolId = document.getElementById('toolId').value; // Kiểm tra xem có đang mang ID cũ không
            const name = document.getElementById('toolName').value;
            const cat = document.getElementById('toolCat').value;
            const price = parseFloat(document.getElementById('toolPrice').value);
            const status = document.getElementById('toolStatus').value;
            const iconFile = document.getElementById('toolIcon').files[0];

            let iconDisplay = '📦'; 
            if (!iconFile) {
                if (cat === 'Gaming') iconDisplay = '🎮';
                if (cat === 'Graphics') iconDisplay = '✨';
                if (cat === 'System') iconDisplay = '⚙️';
            } else {
                iconDisplay = '🖼️'; 
            }

            const productData = {
                name: name,
                category: cat,
                price: price,
                status: status,
                icon: iconDisplay
            };

            try {
                if (toolId) {
                    // CÓ ID: Đây là lệnh UPDATE (Cập nhật)
                    const productRef = doc(db, "products", toolId);
                    await updateDoc(productRef, productData);
                    alert("Cập nhật công cụ thành công!");
                } else {
                    // KHÔNG CÓ ID: Đây là lệnh ADD (Tạo mới)
                    productData.timestamp = new Date(); 
                    await addDoc(collection(db, "products"), productData);
                    alert("Lưu công cụ mới thành công!");
                }
                
                closeModal(); 
                loadProducts(); 
            } catch (error) {
                alert("Lỗi khi lưu dữ liệu: " + error.message);
            }
        };

        // 5. HÀM MỚI: Bấm để Sửa (Edit)
        window.editTool = function(id) {
            const data = currentToolsData[id];
            if(!data) return;

            // Nhét dữ liệu cũ vào các ô để sửa
            document.getElementById('toolId').value = id; // Nhét ID vào chỗ giấu
            document.getElementById('toolName').value = data.name;
            document.getElementById('toolCat').value = data.category;
            document.getElementById('toolPrice').value = data.price;
            document.getElementById('toolStatus').value = data.status;
            
            openModal(); // Mở bảng lên
        };

        // 6. HÀM MỚI: Bấm để Xóa (Delete)
        window.deleteTool = async function(id) {
            // Hỏi lại cho chắc ăn
            if(confirm("Bạn có chắc chắn muốn XÓA VĨNH VIỄN công cụ này khỏi máy chủ không?")) {
                try {
                    const productRef = doc(db, "products", id);
                    await deleteDoc(productRef);
                    alert("Đã xóa công cụ thành công!");
                    loadProducts(); // Tải lại bảng
                } catch(error) {
                    alert("Lỗi khi xóa: " + error.message);
                }
            }
        };

        // Chạy khi khởi động
        document.addEventListener("DOMContentLoaded", () => {
            loadProducts();
        });
    </script>
</body>
</html>
