<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Products | CoreVault Admin</title>
<meta name="description" content="Admin">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body class="bg-gray-900 text-white font-sans" style="visibility:hidden">
<div id="admin-page" data-active="products">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
    <div><h1 data-i18n="prod_title" class="text-2xl md:text-3xl font-bold">Products Vault</h1><p data-i18n="prod_desc" class="text-gray-400 text-sm md:text-base mt-1">Manage your tools.</p></div>
    <button id="btn-add" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg shadow-blue-500/30">＋ <span data-i18n="prod_add">Add New Tool</span></button>
  </div>
  <input type="search" id="search" placeholder="Tìm sản phẩm…" class="w-full md:w-80 mb-4 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
  <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg w-full mb-8 overflow-hidden"><div class="overflow-x-auto">
    <table class="w-full min-w-[720px] text-left"><thead class="bg-gray-900/50 text-gray-400 text-xs uppercase tracking-wider"><tr>
      <th class="p-4 font-medium" data-i18n="prod_th_info">Product</th><th class="p-4 font-medium" data-i18n="prod_th_cat">Category</th><th class="p-4 font-medium" data-i18n="prod_th_price">Price</th><th class="p-4 font-medium" data-i18n="prod_th_status">Status</th><th class="p-4 font-medium text-right" data-i18n="prod_th_action">Actions</th></tr></thead>
    <tbody id="tbody" class="divide-y divide-gray-700/50"></tbody></table></div></div>
</div>

<div id="modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/70 backdrop-blur-sm px-4 py-6" role="dialog" aria-modal="true">
  <div class="bg-gray-800 border border-gray-700 rounded-3xl w-full max-w-4xl max-h-full overflow-y-auto p-6 md:p-8 shadow-2xl">
    <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4"><h3 id="modal-title" class="text-xl md:text-2xl font-bold"></h3><button type="button" id="m-x" class="text-gray-400 hover:text-white text-xl" aria-label="Close">✕</button></div>
    <form id="form" class="space-y-5">
      <input type="hidden" id="f-id">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="block text-sm text-gray-400 mb-1" data-i18n="modal_name">Name *</label><input id="f-name" required maxlength="80" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500"></div>
        <div><label class="block text-sm text-gray-400 mb-1" data-i18n="modal_cat">Category *</label><select id="f-cat" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500"><option>Gaming</option><option>Graphics</option><option>System</option></select></div>
        <div><label class="block text-sm text-gray-400 mb-1" data-i18n="modal_price">Price (USD) * — 0 = Free</label><input type="number" id="f-price" step="0.01" min="0" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500" placeholder="15.00"></div>
        <div><label class="block text-sm text-gray-400 mb-1" data-i18n="modal_status">Status *</label><select id="f-status" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500"><option value="Active">Active</option><option value="Maintenance">Maintenance</option><option value="Hidden">Hidden</option></select></div>
        <div><label class="block text-sm text-gray-400 mb-1">Mô tả (English)</label><textarea id="f-descEn" rows="3" maxlength="1500" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500"></textarea></div>
        <div><label class="block text-sm text-gray-400 mb-1">Mô tả (Tiếng Việt)</label><textarea id="f-descVn" rows="3" maxlength="1500" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500"></textarea></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 bg-gray-900/50 rounded-xl border border-gray-700/50">
        <div><label class="block text-xs font-bold text-gray-400 mb-2">Ảnh bìa (URL, tuỳ chọn)</label><input type="url" id="f-image" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:border-blue-500" placeholder="https://…"></div>
        <div><label class="block text-xs font-bold text-gray-400 mb-2">Trailer YouTube (URL, tuỳ chọn)</label><input type="url" id="f-video" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:border-red-500" placeholder="https://youtube.com/watch?v=…"></div>
        <div class="md:col-span-2 border-t border-gray-700 pt-4"><label class="block text-xs font-bold text-blue-400 mb-1">Link tải (Google Drive, Mediafire…) *</label><p class="text-[11px] text-gray-500 mb-2">Link này được lưu riêng, chỉ người đã mua (hoặc admin) mới đọc được khi đã bật Firestore Rules.</p><input type="url" id="f-dl" required class="w-full bg-gray-800 border border-blue-500/50 rounded-lg px-3 py-2 text-sm focus:border-blue-500" placeholder="https://…"></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="block text-sm text-gray-400 mb-1" data-i18n="modal_req_min">Minimum (1 per line)</label><textarea id="f-min" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="OS: Windows 10&#10;CPU: Intel i5&#10;RAM: 8 GB"></textarea></div>
        <div><label class="block text-sm text-gray-400 mb-1" data-i18n="modal_req_rec">Recommended (1 per line)</label><textarea id="f-rec" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="OS: Windows 11&#10;CPU: Intel i7&#10;RAM: 16 GB"></textarea></div>
      </div>
      <div class="flex justify-end gap-3 pt-5 border-t border-gray-700">
        <button type="button" id="m-cancel" data-i18n="modal_btn_cancel" class="px-5 py-2.5 text-sm font-bold text-gray-300 bg-gray-700 hover:bg-gray-600 rounded-xl">Cancel</button>
        <button type="submit" id="m-save" data-i18n="modal_btn_save" class="px-6 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 disabled:opacity-60 rounded-xl shadow-lg shadow-blue-500/30">Save</button>
      </div>
    </form>
  </div>
</div>
<script src="lang.js"></script>
<script type="module">
import { adminReady } from './auth-guard.js';
import { db, collection, addDoc, getDocs, getDoc, setDoc, doc, updateDoc, deleteDoc, deleteField } from './firebase.js';
import { esc, safeUrl, tsOf, toast, catKey, catIcon, $ } from './common.js';
await adminReady;

let items = [];
const tbody = $('#tbody');
async function load() {
  tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500 animate-pulse">Đang tải…</td></tr>';
  try {
    items = (await getDocs(collection(db, 'products'))).docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => tsOf(b.timestamp) - tsOf(a.timestamp));
    render();
  } catch (e) { console.error(e); tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-red-400">Lỗi kết nối máy chủ!</td></tr>'; }
}
function render() {
  const q = $('#search').value.trim().toLowerCase();
  const rows = items.filter((p) => !q || String(p.name).toLowerCase().includes(q));
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500">Chưa có sản phẩm nào.</td></tr>'; return; }
  tbody.innerHTML = rows.map((p) => {
    const price = Number(p.price) > 0 ? `<span data-price-value="${Number(p.price)}" class="font-bold text-sm"></span>` : '<span class="text-green-400 font-bold text-sm" data-i18n="val_free">FREE</span>';
    const st = { Active: 'bg-green-500/20 text-green-400 border-green-500/30', Maintenance: 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30', Hidden: 'bg-gray-500/20 text-gray-400 border-gray-500/30' }[p.status] || '';
    const stKey = { Active: 'val_active', Maintenance: 'val_maintenance', Hidden: 'val_hidden' }[p.status] || 'val_active';
    const legacy = p.downloadUrl ? '<span title="Link tải còn nằm trong tài liệu công khai — mở Settings → Chuyển dữ liệu" class="ml-2 text-[10px] bg-red-500/20 text-red-300 border border-red-500/40 px-1.5 py-0.5 rounded">⚠ link công khai</span>' : '';
    return `<tr class="hover:bg-gray-700/20"><td class="p-4"><div class="flex items-center gap-3 min-w-[220px]"><div class="w-10 h-10 rounded-lg bg-gray-700 flex items-center justify-center text-xl shrink-0">${esc(p.icon || catIcon(p.category))}</div><p class="font-bold text-sm line-clamp-2">${esc(p.name)}${legacy}</p></div></td>
      <td class="p-4 text-sm text-gray-300 whitespace-nowrap" data-i18n="${catKey(p.category)}"></td><td class="p-4 whitespace-nowrap">${price}</td>
      <td class="p-4 whitespace-nowrap"><span data-i18n="${stKey}" class="px-2.5 py-1 border rounded-full text-xs font-bold ${st}"></span></td>
      <td class="p-4 text-right whitespace-nowrap space-x-3"><a href="detail.html?id=${encodeURIComponent(p.id)}" target="_blank" class="text-gray-400 hover:text-white text-sm">Xem</a><button data-edit="${esc(p.id)}" class="text-blue-400 hover:text-blue-300 text-sm font-medium" data-i18n="btn_edit">Edit</button><button data-del="${esc(p.id)}" class="text-red-400 hover:text-red-300 text-sm font-medium" data-i18n="btn_delete">Delete</button></td></tr>`;
  }).join('');
  window.updateLanguage();
}
$('#search').addEventListener('input', render);

const modal = $('#modal');
const open = () => { modal.classList.remove('hidden'); modal.classList.add('flex'); window.updateLanguage(); };
const close = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };
$('#m-x').onclick = close; $('#m-cancel').onclick = close;
$('#btn-add').onclick = () => { $('#form').reset(); $('#f-id').value = ''; $('#modal-title').textContent = 'Thêm công cụ mới'; open(); };

tbody.addEventListener('click', async (e) => {
  const ed = e.target.closest('[data-edit]'), dl = e.target.closest('[data-del]');
  if (ed) {
    const p = items.find((x) => x.id === ed.dataset.edit); if (!p) return;
    $('#form').reset(); $('#f-id').value = p.id; $('#modal-title').textContent = 'Sửa: ' + p.name;
    $('#f-name').value = p.name || ''; $('#f-cat').value = p.category || 'System'; $('#f-price').value = p.price ?? 0; $('#f-status').value = p.status || 'Active';
    $('#f-descEn').value = p.descEn || ''; $('#f-descVn').value = p.descVn || ''; $('#f-image').value = p.image || ''; $('#f-video').value = p.video || '';
    $('#f-min').value = String(p.reqMin || '').replace(/\\n/g, '\n'); $('#f-rec').value = String(p.reqRec || '').replace(/\\n/g, '\n');
    let url = p.downloadUrl || '';
    try { const s = await getDoc(doc(db, 'products', p.id, 'private', 'download')); if (s.exists()) url = s.data().downloadUrl || url; } catch (err) { /* ignore */ }
    $('#f-dl').value = url; open();
  }
  if (dl) {
    const p = items.find((x) => x.id === dl.dataset.del);
    if (!confirm(`XÓA VĨNH VIỄN "${p ? p.name : ''}"? Không thể hoàn tác.`)) return;
    try { try { await deleteDoc(doc(db, 'products', dl.dataset.del, 'private', 'download')); } catch (e2) { /* có thể chưa tồn tại */ } await deleteDoc(doc(db, 'products', dl.dataset.del)); toast('Đã xóa.', 'success'); load(); }
    catch (err) { toast('Lỗi khi xóa: ' + err.message, 'error'); }
  }
});

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = $('#f-id').value, cat = $('#f-cat').value, dlUrl = safeUrl($('#f-dl').value);
  if (!dlUrl) return toast('Link tải không hợp lệ (phải bắt đầu bằng http/https).', 'error');
  const data = {
    name: $('#f-name').value.trim(), category: cat, price: parseFloat($('#f-price').value) || 0, status: $('#f-status').value,
    descEn: $('#f-descEn').value.trim(), descVn: $('#f-descVn').value.trim(), icon: catIcon(cat),
    image: safeUrl($('#f-image').value), video: safeUrl($('#f-video').value), reqMin: $('#f-min').value, reqRec: $('#f-rec').value
  };
  const btn = $('#m-save'); btn.disabled = true;
  try {
    let pid = id;
    if (id) { await setDoc(doc(db, 'products', id, 'private', 'download'), { downloadUrl: dlUrl }); await updateDoc(doc(db, 'products', id), { ...data, downloadUrl: deleteField() }); }
    else { data.timestamp = new Date(); pid = (await addDoc(collection(db, 'products'), data)).id; await setDoc(doc(db, 'products', pid, 'private', 'download'), { downloadUrl: dlUrl }); }
    toast(id ? 'Đã cập nhật.' : 'Đã thêm công cụ mới.', 'success'); close(); load();
  } catch (err) { console.error(err); toast('Lỗi khi lưu: ' + err.message, 'error'); }
  btn.disabled = false;
});
document.addEventListener('languagechange', render);
load();
</script>
</body>
</html>
