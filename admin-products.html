<!DOCTYPE html>

<body class="bg-gray-900 text-white font-sans overflow-hidden" style="display: none;">

                <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg> <span data-i18n="admin_dashboard">Dashboard</span>
                </a>
                <a href="admin-products.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-600/30 font-medium transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg> <span data-i18n="admin_products">Products</span>
                </a>
                <a href="admin-users.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg> <span data-i18n="admin_users">Users</span>
                </a>
                <a href="admin-orders.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> <span data-i18n="admin_orders">Orders</span>
                </a>
                <a href="admin-settings.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg> <span data-i18n="admin_settings">Settings</span>
                </a>
                <a href="admin-content.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-700 rounded-xl transition-all font-bold">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
    Content Hub
</a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <header class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-4 md:px-8">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white p-2 rounded-lg bg-gray-800 border border-gray-700"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
                    <div class="relative w-40 md:w-64 hidden sm:block">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3"><svg class="w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
                        <input type="text" data-i18n="admin_search" class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-blue-500 transition-colors text-sm" placeholder="Search...">
                    </div>
                </div>
                <div class="flex items-center gap-3 md:gap-4">
                    <button onclick="toggleLanguage()" class="text-gray-300 hover:text-white px-3 py-1.5 text-xs md:text-sm font-medium border border-gray-700 hover:border-gray-500 hover:bg-gray-800 rounded-lg transition-all flex items-center gap-1"><span data-i18n="lang_btn">EN / VN</span></button>
                    <!-- ĐỒNG BỘ GIAO DIỆN HEADER ADMIN Ở ĐÂY -->
                    <div class="flex items-center gap-2">
                        <span id="admin-username-display" class="hidden md:block text-sm font-bold text-gray-300">Admin</span>
                        <div id="admin-profile-btn" onclick="logoutAdmin()" title="Đăng Xuất (Logout)" class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-gray-800 flex items-center justify-center font-bold text-xs md:text-sm shadow-lg cursor-pointer hover:scale-110 transition-transform overflow-hidden border border-gray-600">LR</div>
                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 md:mb-8 gap-4">
                    <div>
                        <h1 data-i18n="prod_title" class="text-2xl md:text-3xl font-bold text-white">Products Vault</h1>
                        <p data-i18n="prod_desc" class="text-gray-400 text-sm md:text-base mt-1">Manage your tools, updates, pricing, and downloads.</p>
                    </div>
                    <button onclick="openModal()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg shadow-blue-500/30">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg><span data-i18n="prod_add">Add New Tool</span>
                    </button>
                </div>
                
                <!-- ĐÃ FIX: Bao bọc Table tránh lỗi văng scroll -->
                <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg w-full mb-8 overflow-hidden">
                    <div class="overflow-x-auto w-full">
                        <table class="w-full min-w-[700px] text-left border-collapse">
                            <thead class="bg-gray-900/50 text-gray-400 text-xs uppercase tracking-wider">
                                <tr>
                                    <th data-i18n="prod_th_info" class="p-4 font-medium">Product Info</th>
                                    <th data-i18n="prod_th_cat" class="p-4 font-medium">Category</th>
                                    <th data-i18n="prod_th_price" class="p-4 font-medium">Price</th>
                                    <th data-i18n="prod_th_status" class="p-4 font-medium">Status</th>
                                    <th data-i18n="prod_th_action" class="p-4 font-medium text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-700/50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Giữ nguyên Modal thêm/sửa Tool -->
    <div id="addToolModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 px-4">
        <div class="bg-gray-800 border border-gray-700 rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-y-auto p-6 md:p-8 shadow-2xl relative transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                <h3 data-i18n="prod_add" id="modalTitle" class="text-xl md:text-2xl font-bold text-white">Add New Tool</h3>
                <button type="button" onclick="closeModal()" class="text-gray-400 hover:text-white transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <form id="addToolForm" onsubmit="saveTool(event)">
                <input type="hidden" id="toolId" value="">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5 mb-5">
                    <div>
                        <label data-i18n="modal_name" class="block text-sm font-medium text-gray-400 mb-1">Product Name *</label>
                        <input type="text" id="toolName" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label data-i18n="modal_cat" class="block text-sm font-medium text-gray-400 mb-1">Category *</label>
                        <select id="toolCat" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                            <option value="Gaming">Gaming</option>
                            <option value="Graphics">Graphics</option>
                            <option value="System">System</option>
                        </select>
                    </div>
                    <div>
                        <label data-i18n="modal_price" class="block text-sm font-medium text-gray-400 mb-1">Price * (0 for Free)</label>
                        <input type="number" id="toolPrice" step="0.01" min="0" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. 15.00">
                    </div>
                    <div>
                        <label data-i18n="modal_status" class="block text-sm font-medium text-gray-400 mb-1">Status *</label>
                        <select id="toolStatus" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                            <option value="Active">Active</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="Hidden">Hidden</option>
                        </select>
                    </div>
                </div>
                <div class="mb-5">
                    <label data-i18n="modal_desc" class="block text-sm font-medium text-gray-400 mb-1">Description</label>
                    <textarea id="toolDesc" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 placeholder-gray-600" placeholder="Enter detailed product description..."></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5 p-4 bg-gray-900/50 rounded-xl border border-gray-700/50">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2">Cover Image URL (Optional)</label>
                        <input type="url" id="toolImage" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-white focus:border-blue-500 text-sm" placeholder="https://imgur.com/...">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2">YouTube Trailer URL (Optional)</label>
                        <input type="url" id="toolVideo" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-white focus:border-red-500 text-sm" placeholder="https://youtube.com/watch?v=...">
                    </div>
                    <div class="md:col-span-2 mt-2 border-t border-gray-700 pt-4">
                        <label class="block text-xs font-bold text-blue-400 mb-2">Download URL (Direct Link) *</label>
                        <input type="url" id="toolDownload" required class="w-full bg-gray-800 border border-blue-500/50 rounded-lg px-3 py-2 text-white focus:border-blue-500 text-sm" placeholder="Link Google Drive, Mediafire...">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
                    <div>
                        <label data-i18n="modal_req_min" class="block text-sm font-medium text-gray-400 mb-1">Minimum Requirements</label>
                        <textarea id="toolReqMin" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 text-sm placeholder-gray-600" placeholder="OS: Windows 10&#10;Processor: Intel i5&#10;Memory: 8 GB RAM"></textarea>
                    </div>
                    <div>
                        <label data-i18n="modal_req_rec" class="block text-sm font-medium text-gray-400 mb-1">Recommended Specs</label>
                        <textarea id="toolReqRec" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 text-sm placeholder-gray-600" placeholder="OS: Windows 11&#10;Processor: Intel i7&#10;Memory: 16 GB RAM"></textarea>
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-5 border-t border-gray-700">
                    <button type="button" onclick="closeModal()" data-i18n="modal_btn_cancel" class="px-5 py-2.5 text-sm font-bold text-gray-400 hover:text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl transition-colors">Cancel</button>
                    <button type="submit" data-i18n="modal_btn_save" class="px-6 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 rounded-xl shadow-lg shadow-blue-500/30 transition-all">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="lang.js"></script>
    <script type="module" src="auth-guard.js"></script>
    <script>function toggleSidebar() { document.getElementById('admin-sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }</script>
    <script type="module">
        import { db, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from './firebase.js';

        let currentToolsData = {};

        window.openModal = function() {
            const modal = document.getElementById('addToolModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
            updateLanguage(); 
        };

        window.closeModal = function() {
            const modal = document.getElementById('addToolModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0'); content.classList.remove('scale-100'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); document.getElementById('addToolForm').reset(); document.getElementById('toolId').value = ''; }, 300);
        };

        window.loadProducts = async function() {
            const tbody = document.querySelector('tbody');
            tbody.innerHTML = '<tr><td colspan=\"5\" class=\"text-center p-8 text-gray-500 animate-pulse\">Đang tải dữ liệu từ máy chủ...</td></tr>';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                tbody.innerHTML = ''; currentToolsData = {}; 
                if (querySnapshot.empty) { tbody.innerHTML = '<tr><td colspan=\"5\" class=\"text-center p-8 text-gray-500\">Kho sản phẩm trống. Hãy thêm công cụ mới!</td></tr>'; return; }
                querySnapshot.forEach((documentSnapshot) => {
                    const data = documentSnapshot.data(); const docId = documentSnapshot.id; currentToolsData[docId] = data;
                    const newRow = document.createElement('tr'); newRow.className = "hover:bg-gray-700/20 transition-colors group";
                    const catI18n = data.category === 'Gaming' ? 'val_gaming' : (data.category === 'Graphics' ? 'val_graphics' : 'val_system');
                    const statusI18n = data.status === 'Active' ? 'val_active' : (data.status === 'Maintenance' ? 'val_maintenance' : 'val_hidden');
                    let priceDisplay = data.price === 0 ? '<span data-i18n=\"val_free\" class=\"text-green-400 font-bold text-sm\">FREE</span>' : `<span data-price-value=\"${data.price}\" class=\"text-white font-bold text-sm\"></span>`;
                    let statusDisplay = data.status === 'Active' ? `<span data-i18n=\"${statusI18n}\" class=\"px-2.5 py-1 bg-green-500/20 text-green-400 border border-green-500/30 rounded-full text-xs font-bold\">Active</span>` : `<span data-i18n=\"${statusI18n}\" class=\"px-2.5 py-1 bg-yellow-500/20 text-yellow-500 border border-yellow-500/30 rounded-full text-xs font-bold\">${data.status}</span>`;
                    newRow.innerHTML = `
                        <td class=\"p-4 flex items-center gap-4 min-w-[250px]\"><div class=\"w-10 h-10 md:w-12 md:h-12 rounded-lg bg-gray-700 flex items-center justify-center text-xl shrink-0\">${data.icon}</div><div><p class=\"text-white font-bold text-sm line-clamp-2\">${data.name}</p></div></td>
                        <td class=\"p-4\"><span data-i18n=\"${catI18n}\" class=\"text-gray-300 text-sm whitespace-nowrap\">${data.category}</span></td>
                        <td class=\"p-4 whitespace-nowrap\">${priceDisplay}</td>
                        <td class=\"p-4 whitespace-nowrap\">${statusDisplay}</td>
                        <td class=\"p-4 text-right space-x-2 md:space-x-3 whitespace-nowrap\"><button onclick=\"editTool('${docId}')\" data-i18n=\"btn_edit\" class=\"text-blue-400 hover:text-blue-300 font-medium transition-colors text-sm\">Edit</button><button onclick=\"deleteTool('${docId}')\" data-i18n=\"btn_delete\" class=\"text-red-400 hover:text-red-300 font-medium transition-colors text-sm\">Delete</button></td>
                    `;
                    tbody.prepend(newRow); 
                });
                if (typeof updateLanguage === 'function') updateLanguage();
            } catch (error) { tbody.innerHTML = '<tr><td colspan=\"5\" class=\"text-center p-8 text-red-500\">Lỗi kết nối máy chủ!</td></tr>'; }
        };

        window.saveTool = async function(e) {
            e.preventDefault(); 
            const toolId = document.getElementById('toolId').value; 
            const name = document.getElementById('toolName').value; const cat = document.getElementById('toolCat').value;
            const price = parseFloat(document.getElementById('toolPrice').value); const status = document.getElementById('toolStatus').value;
            const desc = document.getElementById('toolDesc').value; const imageUrl = document.getElementById('toolImage').value;
            const videoUrl = document.getElementById('toolVideo').value; const downloadUrl = document.getElementById('toolDownload').value;
            const reqMin = document.getElementById('toolReqMin').value; const reqRec = document.getElementById('toolReqRec').value;
            let iconDisplay = '📦'; if (cat === 'Gaming') iconDisplay = '🎮'; if (cat === 'Graphics') iconDisplay = '✨'; if (cat === 'System') iconDisplay = '⚙️';

            const productData = { name: name, category: cat, price: price, status: status, descEn: desc, icon: iconDisplay, image: imageUrl, video: videoUrl, downloadUrl: downloadUrl, reqMin: reqMin, reqRec: reqRec };
            try {
                if (toolId) { await updateDoc(doc(db, "products", toolId), productData); alert("Cập nhật công cụ thành công!"); } 
                else { productData.timestamp = new Date(); await addDoc(collection(db, "products"), productData); alert("Lưu công cụ mới thành công!"); }
                closeModal(); loadProducts(); 
            } catch (error) { alert("Lỗi khi lưu dữ liệu: " + error.message); }
        };

        window.editTool = function(id) {
            const data = currentToolsData[id]; if(!data) return;
            document.getElementById('toolId').value = id; document.getElementById('toolName').value = data.name; document.getElementById('toolCat').value = data.category;
            document.getElementById('toolPrice').value = data.price; document.getElementById('toolStatus').value = data.status; document.getElementById('toolDesc').value = data.descEn || "";
            document.getElementById('toolImage').value = data.image || ""; document.getElementById('toolVideo').value = data.video || "";
            document.getElementById('toolDownload').value = data.downloadUrl || ""; document.getElementById('toolReqMin').value = data.reqMin || ""; document.getElementById('toolReqRec').value = data.reqRec || "";
            openModal(); 
        };

        window.deleteTool = async function(id) {
            if(confirm("Bạn có chắc chắn muốn XÓA VĨNH VIỄN công cụ này khỏi máy chủ không?")) {
                try { await deleteDoc(doc(db, "products", id)); alert("Đã xóa công cụ thành công!"); loadProducts(); } catch(error) { alert("Lỗi khi xóa: " + error.message); }
            }
        };

        document.addEventListener("DOMContentLoaded", () => { loadProducts(); });
    </script>
</body>
</html>
