<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ASMR Player | CoreVault</title>
<meta name="description" content="Nghe ASMR và âm thanh thư giãn.">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body class="bg-[#0b0b12] text-gray-100 min-h-screen flex flex-col relative overflow-x-hidden" data-fab="off"><div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] bg-indigo-900/10 rounded-full blur-[150px] pointer-events-none"></div><div class="fixed bottom-[20%] left-[-10%] w-[400px] h-[400px] bg-purple-900/10 rounded-full blur-[120px] pointer-events-none"></div><header class="sticky top-0 z-40 bg-[#0b0b12]/80 backdrop-blur-xl border-b border-gray-800/60">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
    <a href="asmr.html" class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg><span class="font-bold text-sm" data-i18n="asmr_back_station">Back to ASMR Station</span></a>
    <div class="flex items-center gap-3">
      <button onclick="toggleLanguage()" class="text-xs font-bold border border-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-800" data-i18n="lang_btn">EN / VN</button>
      <button id="btn-donate" class="bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-gray-900 font-extrabold text-xs px-4 py-2 rounded-full shadow-lg transition-transform hover:scale-105">☕ <span data-i18n="asmr_donate">Donate</span></button>
      <div id="header-auth" class="flex items-center gap-2"></div>
    </div>
  </div>
</header>
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8 relative z-10">
  <div class="lg:col-span-2">
    <div class="bg-[#12121f] rounded-3xl border border-gray-800/60 p-4 shadow-2xl">
      <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden relative">
        <video id="player" class="w-full h-full object-cover" controls playsinline preload="metadata"></video>
        <div id="audio-overlay" class="absolute inset-0 bg-[#07070a] flex flex-col items-center justify-center gap-4 opacity-0 pointer-events-none transition-opacity duration-500">
          <div class="w-16 h-16 rounded-full bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 animate-pulse text-2xl">🎧</div>
          <p class="text-xs font-bold uppercase tracking-widest text-indigo-400/80" data-i18n="asmr_audio_mode">Audio-only mode active</p>
        </div>
        <div id="player-msg" class="hidden absolute inset-0 bg-black/80 flex items-center justify-center text-center p-6 text-gray-300 text-sm"></div>
      </div>
      <div class="mt-4 flex flex-wrap items-center justify-between gap-4 bg-[#09090f] p-3 rounded-xl border border-gray-800/40">
        <div class="flex items-center gap-3 flex-wrap">
          <button id="btn-audio" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-xl text-xs font-bold border border-gray-700/60" data-i18n="asmr_audio_off">👁️ Turn off display</button>
          <label class="flex items-center gap-1 bg-gray-800 border border-gray-700/60 rounded-xl px-2"><span class="text-[11px] font-bold text-gray-400 pl-1">⏰ <span data-i18n="asmr_sleep">Sleep</span>:</span>
            <select id="sleep" class="bg-transparent text-xs font-bold text-white py-2 px-1 focus:outline-none cursor-pointer">
              <option value="off" class="bg-gray-900" data-i18n="asmr_off">Off</option><option value="15" class="bg-gray-900">15</option><option value="30" class="bg-gray-900">30</option><option value="60" class="bg-gray-900">60</option>
            </select><span class="text-[11px] text-gray-500 pr-1">min</span></label>
        </div>
        <p id="countdown" class="text-xs font-mono font-bold text-indigo-400 hidden"></p>
      </div>
      <div class="mt-6 px-2">
        <div id="tags" class="mb-3 flex gap-2 flex-wrap"></div>
        <h1 id="title" class="text-2xl md:text-3xl font-black tracking-tight leading-tight break-words"></h1>
        <p id="desc" class="text-sm text-gray-400 mt-4 leading-relaxed whitespace-pre-line break-words"></p>
      </div>
    </div>
  </div>
  <aside class="flex flex-col gap-4">
    <h2 class="text-lg font-black tracking-tight" data-i18n="asmr_recommended">Recommended Sessions</h2>
    <div id="recs" class="space-y-3"></div>
  </aside>
</main>

<div id="key-modal" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-4 backdrop-blur-md" role="dialog" aria-modal="true">
  <form id="key-form" class="bg-[#12121f] border border-red-500/20 rounded-3xl p-8 w-full max-w-md shadow-2xl text-center">
    <div class="w-16 h-16 bg-red-500/10 border border-red-500/30 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">🔒</div>
    <h3 class="text-2xl font-black mb-2" data-i18n="asmr_key_title">Limited Premium Session</h3>
    <p class="text-gray-400 text-sm mb-6 leading-relaxed" data-i18n="asmr_key_desc">This session requires an unlock key.</p>
    <input type="text" id="key-input" autocomplete="off" data-i18n="asmr_key_ph" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-center uppercase tracking-widest font-mono mb-4">
    <p id="key-err" class="hidden text-red-400 text-xs mb-3"></p>
    <div class="flex gap-3">
      <a href="asmr.html" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-bold text-sm text-gray-300 flex items-center justify-center" data-i18n="asmr_back">Go Back</a>
      <button type="submit" id="key-ok" class="flex-1 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-60 py-3 rounded-xl font-bold text-sm shadow-lg shadow-indigo-500/30" data-i18n="asmr_unlock">Unlock</button>
    </div>
  </form>
</div>
<div id="donate-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4 backdrop-blur-md" role="dialog" aria-modal="true">
  <div class="bg-[#12121f] border border-gray-800 rounded-3xl p-8 w-full max-w-sm shadow-2xl relative text-center">
    <button id="donate-close" aria-label="Close" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-gray-800 w-9 h-9 rounded-full">✕</button>
    <div class="text-4xl mb-3">🎁</div>
    <h3 class="text-2xl font-black mb-2" data-i18n="asmr_support_title">Support My Work</h3>
    <p class="text-gray-400 text-sm mb-6 leading-relaxed" data-i18n="asmr_support_desc">All full-length sessions are free. Your donation helps me stay independent and improve my audio equipment!</p>
    <a href="https://paypal.me/thaituan2801" target="_blank" rel="noopener noreferrer" class="w-full bg-[#0070ba] hover:bg-[#005ea6] text-white font-black py-4 rounded-xl text-sm transition-all shadow-lg flex items-center justify-center" data-i18n="asmr_paypal">Send Support via PayPal</a>
  </div>
</div>
<script src="lang.js"></script>
<script type="module">
import { db, doc, getDoc, setDoc, collection, getDocs, query, orderBy, limit } from './firebase.js';
import { onUser, renderHeaderAuth, esc, safeUrl, authUrl, checkMaintenance, t, $ } from './common.js';

const dm = $('#donate-modal');
const openDonate = () => { dm.classList.remove('hidden'); dm.classList.add('flex'); };
const closeDonate = () => { dm.classList.add('hidden'); dm.classList.remove('flex'); };
$('#btn-donate').onclick = openDonate; $('#donate-close').onclick = closeDonate;
dm.addEventListener('click', (e) => { if (e.target === dm) closeDonate(); });

const vid = new URLSearchParams(location.search).get('id');
if (!vid) location.replace('asmr.html');
let me = null, video = null, timer = null;
const player = $('#player');

onUser(async (u, p) => {
  if (await checkMaintenance('asmrLocked', p)) return;
  me = p; renderHeaderAuth(p, { ring: 'border-indigo-500' });
  init(); recommendations();
}, { require: false });

const showMsg = (k) => { const m = $('#player-msg'); m.textContent = t(k); m.classList.remove('hidden'); };

async function init() {
  try {
    const s = await getDoc(doc(db, 'asmr_videos', vid));
    if (!s.exists()) return location.replace('asmr.html');
    video = s.data();
    document.title = `${video.title} | ASMR`;
    $('#title').textContent = video.title; $('#desc').textContent = video.desc || '';
    $('#tags').innerHTML = `<span class="bg-gray-800 text-gray-300 text-[10px] px-2 py-1 rounded font-bold border border-gray-700">${esc(video.quality || 'HD Audio')}</span>` +
      (video.isLimited ? `<span class="bg-red-500/20 text-red-400 text-[10px] px-2 py-1 rounded font-bold border border-red-500/30" data-i18n="asmr_limited_short">LIMITED</span>` : '');
    window.updateLanguage();
    if (!video.isLimited) return play();
    if (!me) return location.replace(authUrl());
    if (me.isAdmin) return play();
    try { if ((await getDoc(doc(db, 'asmr_unlocks', `${me.uid}_${vid}`))).exists()) return play(); } catch (e) { /* chưa mở khóa */ }
    openKey();
  } catch (e) { console.error(e); showMsg('err_load'); }
}

async function mediaUrl() {
  let url = '';
  try { const p = await getDoc(doc(db, 'asmr_videos', vid, 'private', 'media')); if (p.exists()) url = p.data().url || ''; } catch (e) { /* ignore */ }
  return safeUrl(url || video.url);
}
async function play() {
  const url = await mediaUrl();
  if (!url) return showMsg('asmr_media_err');
  player.volume = Number(localStorage.getItem('cv_asmr_vol') || 0.35);
  player.addEventListener('volumechange', () => localStorage.setItem('cv_asmr_vol', player.volume));
  player.onerror = () => showMsg('asmr_media_err');
  player.src = url;
  setTimeout(() => { if (sessionStorage.getItem('cv_donated') !== '1') { sessionStorage.setItem('cv_donated', '1'); openDonate(); } }, 15 * 60 * 1000);
}

// ---------- Mã mở khóa (lưu trong Firestore, không còn nằm trong mã nguồn) ----------
const km = $('#key-modal');
const openKey = () => { km.classList.remove('hidden'); km.classList.add('flex'); $('#key-input').focus(); window.updateLanguage(); };
$('#key-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const key = $('#key-input').value.trim().toUpperCase().replace(/[\/\s]/g, ''), err = $('#key-err'), btn = $('#key-ok');
  if (!key) return;
  btn.disabled = true; err.classList.add('hidden');
  try {
    const k = await getDoc(doc(db, 'asmr_keys', key));
    if (!k.exists()) throw new Error('bad-key');
    try { await setDoc(doc(db, 'asmr_unlocks', `${me.uid}_${vid}`), { uid: me.uid, videoId: vid, key, timestamp: Date.now() }); } catch (e2) { /* nếu đã tồn tại thì bỏ qua */ }
    km.classList.add('hidden'); km.classList.remove('flex'); play();
  } catch (e2) { err.textContent = t('asmr_bad_key'); err.classList.remove('hidden'); }
  btn.disabled = false;
});

// ---------- Gợi ý ----------
async function recommendations() {
  try {
    const snap = await getDocs(query(collection(db, 'asmr_videos'), orderBy('timestamp', 'desc'), limit(8)));
    const rows = snap.docs.filter((d) => d.id !== vid).slice(0, 5);
    $('#recs').innerHTML = rows.map((d) => {
      const x = d.data(), thumb = safeUrl(x.thumbnail) || `https://ui-avatars.com/api/?name=${encodeURIComponent(String(x.title || 'A').slice(0, 2))}&background=1e1e2f&color=6366f1&size=256`;
      return `<a href="asmr-play.html?id=${encodeURIComponent(d.id)}" class="flex gap-3 items-start group p-2 rounded-xl hover:bg-gray-800/50 transition-colors"><img src="${esc(thumb)}" alt="" loading="lazy" class="w-32 h-20 rounded-lg object-cover bg-gray-800 border border-gray-700/50 shrink-0"><div class="min-w-0"><h3 class="text-sm font-bold text-gray-200 group-hover:text-indigo-300 line-clamp-2 mb-1">${esc(x.title)}</h3><p class="text-[11px] text-gray-500">${esc(x.quality || 'Stereo')}${x.isLimited ? ' · 🔒' : ''}</p></div></a>`;
    }).join('') || `<p class="text-sm text-gray-600">—</p>`;
  } catch (e) { /* ignore */ }
}

// ---------- Chế độ chỉ nghe + hẹn giờ ngủ ----------
let audioOnly = false;
$('#btn-audio').onclick = () => {
  audioOnly = !audioOnly;
  $('#audio-overlay').classList.toggle('opacity-0', !audioOnly); $('#audio-overlay').classList.toggle('pointer-events-none', !audioOnly);
  const b = $('#btn-audio'); b.setAttribute('data-i18n', audioOnly ? 'asmr_audio_on' : 'asmr_audio_off');
  b.className = audioOnly ? 'bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold border border-indigo-500' : 'bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-xl text-xs font-bold border border-gray-700/60';
  window.updateLanguage();
};
$('#sleep').onchange = (e) => {
  clearInterval(timer); const cd = $('#countdown');
  if (e.target.value === 'off') return cd.classList.add('hidden');
  let left = parseInt(e.target.value, 10) * 60; cd.classList.remove('hidden');
  const tick = () => {
    if (left <= 0) { clearInterval(timer); player.pause(); cd.textContent = '⏱️ ' + t('asmr_paused'); return; }
    cd.textContent = `⏱️ ${t('asmr_autopause')}: ${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`; left--;
  };
  tick(); timer = setInterval(tick, 1000);
};
document.addEventListener('languagechange', () => { if (video) window.updateLanguage(); });
</script>
</body>
</html>
