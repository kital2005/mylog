<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Video Hub | CoreVault</title>
<meta name="description" content="Lướt video ngắn và chia sẻ video chất lượng cao.">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body class="bg-[#0f0f13] text-white h-[100dvh] flex flex-col overflow-hidden" data-fab="off">
<header class="fixed top-0 inset-x-0 z-40 p-4 flex justify-between items-center pointer-events-none bg-gradient-to-b from-black/70 to-transparent">
  <a href="index.html" class="pointer-events-auto flex items-center gap-2 hover:scale-105 transition-transform" aria-label="Home"><img src="logo.svg" alt="" class="w-9 h-9 rounded-xl"><span class="font-bold hidden sm:block" data-i18n="back_hub">Back to Hub</span></a>
  <div class="pointer-events-auto flex items-center gap-3">
    <button onclick="toggleLanguage()" class="text-xs font-bold border border-white/20 bg-black/40 px-3 py-1.5 rounded-lg" data-i18n="lang_btn">EN / VN</button>
    <button id="btn-share" class="bg-rose-600 hover:bg-rose-500 px-4 py-2 rounded-full font-bold text-sm shadow-[0_0_15px_rgba(225,29,72,0.6)] transition-transform hover:scale-105">＋ <span class="hidden sm:inline" data-i18n="vid_upload_btn">Share Video</span></button>
    <div id="header-auth" class="flex items-center gap-2"></div>
  </div>
</header>

<main id="video-feed" class="flex-grow w-full md:max-w-[450px] mx-auto snap-y snap-mandatory overflow-y-scroll no-scrollbar h-full bg-black relative shadow-[0_0_50px_rgba(0,0,0,0.8)]"></main>

<div id="upload-modal" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-4 backdrop-blur-md" role="dialog" aria-modal="true">
  <div class="bg-gray-900 border border-gray-700 rounded-3xl p-6 md:p-8 w-full max-w-md shadow-2xl relative">
    <button type="button" id="m-close" aria-label="Close" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-gray-800 w-9 h-9 rounded-full">✕</button>
    <h2 class="text-2xl font-extrabold mb-2 text-center" data-i18n="vid_modal_title">Share a Video</h2>
    <p class="text-center text-gray-400 text-sm mb-6" data-i18n="vid_modal_desc">Paste a YouTube or direct .mp4 link.</p>
    <form id="vid-form" class="space-y-4">
      <input type="text" id="vTitle" required maxlength="150" data-i18n="vid_ph_title" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500">
      <input type="text" id="vQuality" maxlength="30" data-i18n="vid_quality" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500">
      <input type="url" id="vLink" required placeholder="https://youtube.com/…  or  https://…/video.mp4" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500">
      <div class="flex gap-3 pt-3">
        <button type="button" id="m-cancel" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-bold text-gray-300" data-i18n="btn_cancel">Cancel</button>
        <button type="submit" id="m-ok" class="flex-1 bg-rose-600 hover:bg-rose-500 disabled:opacity-60 py-3 rounded-xl font-bold shadow-lg shadow-rose-500/30" data-i18n="btn_publish">Publish</button>
      </div>
    </form>
  </div>
</div>

<script src="lang.js"></script>
<script type="module">
import { db, collection, addDoc, getDocs, doc, deleteDoc, query, orderBy, limit } from './firebase.js';
import { onUser, renderHeaderAuth, esc, safeUrl, youtubeId, toast, t, $, checkMaintenance, getAdminUids, isAdminAuthor, makeThumb } from './common.js';

let me = null, adminUids = [], items = [];
const feed = $('#video-feed');

onUser(async (u, p) => {
  if (await checkMaintenance('videosLocked', p)) return;
  me = p; me.thumb = await makeThumb(p.avatar, 64); adminUids = await getAdminUids();
  renderHeaderAuth(p, { ring: p.isAdmin ? 'border-red-500' : 'border-rose-500' });
  load();
}, { require: true });

// Chỉ nạp video khi lướt tới (tiết kiệm băng thông, không phát nhiều video cùng lúc)
const io = new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    const slot = en.target.querySelector('[data-slot]');
    if (en.isIntersecting && en.intersectionRatio >= 0.6) {
      if (slot.firstElementChild) return;
      const yid = slot.dataset.yid;
      slot.innerHTML = yid
        ? `<iframe class="w-full h-full" src="https://www.youtube-nocookie.com/embed/${esc(yid)}?rel=0&playsinline=1" title="Video" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`
        : `<video src="${esc(slot.dataset.src)}" class="w-full h-full object-contain bg-black" controls playsinline preload="metadata"></video>`;
      const v = slot.querySelector('video'); if (v) v.onerror = () => { slot.innerHTML = `<div class="h-full flex items-center justify-center text-center p-6 text-gray-400 text-sm">${esc(t('vid_err'))}</div>`; };
    } else if (!en.isIntersecting && slot.firstElementChild) { slot.innerHTML = ''; }
  });
}, { root: feed, threshold: [0, 0.6] });

async function load() {
  feed.innerHTML = '<div class="h-full flex items-center justify-center"><div class="w-12 h-12 border-4 border-rose-500 border-t-transparent rounded-full animate-spin"></div></div>';
  try {
    const snap = await getDocs(query(collection(db, 'videos'), orderBy('timestamp', 'desc'), limit(50)));
    items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  } catch (e) { console.error(e); feed.innerHTML = `<div class="h-full flex items-center justify-center text-red-400 font-bold">${esc(t('err_load'))}</div>`; }
}
function render() {
  io.disconnect();
  if (!items.length) { feed.innerHTML = `<div class="h-full flex items-center justify-center text-gray-500 font-bold text-center p-6" data-i18n="vid_empty">No videos yet. Be the first!</div>`; return window.updateLanguage(); }
  feed.innerHTML = items.map((d) => {
    const url = safeUrl(d.url); if (!url) return '';
    const yid = youtubeId(url), adm = isAdminAuthor(d, adminUids);
    const canDel = me.isAdmin || me.uid === d.uid;
    const poster = yid ? `https://i.ytimg.com/vi/${yid}/hqdefault.jpg` : '';
    return `<section data-id="${esc(d.id)}" class="h-[100dvh] w-full snap-start relative bg-black flex items-center justify-center overflow-hidden">
      ${poster ? `<img src="${esc(poster)}" alt="" class="absolute inset-0 w-full h-full object-cover opacity-30 blur-sm">` : ''}
      <div data-slot ${yid ? `data-yid="${esc(yid)}"` : `data-src="${esc(url)}"`} class="relative w-full ${yid ? 'aspect-[9/16] max-h-full' : 'h-full'}"></div>
      <div class="absolute bottom-0 left-0 w-full p-4 pb-6 bg-gradient-to-t from-black via-black/60 to-transparent z-10 pointer-events-none pr-20">
        <h3 class="${adm ? 'text-red-400 font-extrabold' : 'text-white font-bold'} text-[16px] mb-2 flex items-center gap-2 flex-wrap">@${esc(d.authorName)}
          ${adm ? '<span class="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-sm tracking-widest">ADMIN</span>' : ''}
          <span class="bg-rose-600/90 text-white text-[10px] px-2 py-0.5 rounded">${esc(d.quality || 'HD')}</span></h3>
        <p class="text-[14px] text-gray-100 line-clamp-2 leading-snug break-words">${esc(d.title)}</p>
      </div>
      <div class="absolute bottom-24 right-3 flex flex-col items-center gap-5 z-20">
        <img src="${esc(safeUrl(d.authorAvatar, { data: true }) || 'logo.svg')}" alt="" class="w-12 h-12 rounded-full border-2 ${adm ? 'border-red-500' : 'border-white'} object-cover bg-gray-800">
        <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center hover:bg-rose-600 transition-colors border border-white/30" title="Source">↗</a>
        ${canDel ? `<button data-del class="w-12 h-12 bg-black/60 rounded-full hover:text-red-500 transition border border-gray-700" aria-label="Delete">🗑</button>` : ''}
      </div></section>`;
  }).join('');
  feed.querySelectorAll('section').forEach((s) => io.observe(s));
}
feed.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  if (!confirm(t('vid_confirm_del'))) return;
  try { await deleteDoc(doc(db, 'videos', b.closest('section').dataset.id)); load(); } catch (err) { toast(t('err_perm'), 'error'); }
});

// ---------- Đăng video ----------
const modal = $('#upload-modal');
const open = () => { modal.classList.remove('hidden'); modal.classList.add('flex'); $('#vTitle').focus(); };
const close = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };
$('#btn-share').onclick = open; $('#m-close').onclick = close; $('#m-cancel').onclick = close;
modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
$('#vid-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = safeUrl($('#vLink').value);
  if (!url) return toast(t('err_url'), 'error');
  const btn = $('#m-ok'); btn.disabled = true;
  try {
    await addDoc(collection(db, 'videos'), { uid: me.uid, authorName: me.username, authorAvatar: me.thumb, isAdmin: me.isAdmin, title: $('#vTitle').value.trim(), quality: $('#vQuality').value.trim(), url, timestamp: Date.now() });
    e.target.reset(); close(); toast(t('msg_published'), 'success'); load();
  } catch (err) { console.error(err); toast(t('err_perm'), 'error'); }
  btn.disabled = false;
});
</script>
</body>
</html>
