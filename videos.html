<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CoreVault | Video Hub</title><link rel="icon" type="image/svg+xml" href="logo.svg"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script>tailwind.config={theme:{extend:{colors:{primary:'#3b82f6'},fontFamily:{sans:['Inter','sans-serif']}}}}</script>
</head>
<body class="bg-[#0f0f13] text-white h-screen flex flex-col overflow-hidden">

    <nav class="absolute top-0 z-50 w-full bg-gradient-to-b from-black/90 via-black/50 to-transparent p-4 flex justify-between items-center pointer-events-none">
        <a href="index.html" class="pointer-events-auto flex items-center gap-2 hover:scale-105 transition-transform"><svg class="w-8 h-8 text-rose-500 drop-shadow-[0_0_10px_rgba(225,29,72,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg></a>
        <div class="pointer-events-auto flex items-center gap-4">
            <button onclick="document.getElementById('upload-modal').classList.remove('hidden')" class="bg-rose-600 hover:bg-rose-500 px-5 py-2 rounded-full font-bold text-sm shadow-[0_0_15px_rgba(225,29,72,0.6)] transition-transform hover:scale-105 flex items-center gap-2">
                <svg class="w-4 h-4 font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg> <span class="hidden sm:block" data-i18n="vid_upload_btn">Share Link</span>
            </button>
            <div id="header-auth"></div>
        </div>
    </nav>

    <!-- TIKTOK STYLE FEED (CUỘN DỌC TỪNG VIDEO MỘT) -->
    <main id="video-feed" class="flex-grow w-full md:max-w-[450px] mx-auto snap-y snap-mandatory overflow-y-scroll no-scrollbar h-full bg-black relative shadow-[0_0_50px_rgba(0,0,0,0.8)]">
        <div class="h-full flex flex-col items-center justify-center text-gray-500">
            <div class="w-12 h-12 border-4 border-rose-500 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_15px_rgba(225,29,72,0.5)]"></div>
            <p class="font-bold tracking-widest text-xs">LOADING HUB...</p>
        </div>
    </main>

    <!-- MODAL CHIA SẺ LINK BÊN NGOÀI -->
    <div id="upload-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-gray-900 border border-gray-700 rounded-3xl p-6 md:p-8 w-full max-w-md shadow-2xl relative">
            <button type="button" onclick="document.getElementById('upload-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-gray-800 p-2 rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            <h2 class="text-2xl font-extrabold mb-2 text-white text-center" data-i18n="vid_modal_title">Share a Video</h2>
            <p class="text-center text-gray-400 text-sm mb-6">Paste your video link below. We support YouTube and direct MP4 links.</p>
            
            <form onsubmit="submitVideo(event)" class="space-y-4">
                <input type="text" id="vTitle" required placeholder="Video Title & Caption" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500 text-white placeholder-gray-500 transition-colors">
                <input type="text" id="vQuality" placeholder="Quality (e.g., 4K 60FPS RAW)" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500 text-white placeholder-gray-500 transition-colors">
                
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg></div>
                    <input type="url" id="vLink" required placeholder="https://youtube.com/... or .mp4 link" class="w-full bg-gray-800 border border-gray-700 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-rose-500 text-white placeholder-gray-500 transition-colors">
                </div>
                
                <div class="flex gap-3 mt-8">
                    <button type="button" onclick="document.getElementById('upload-modal').classList.add('hidden')" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-bold text-gray-300 transition-colors">Cancel</button>
                    <button type="submit" class="flex-1 bg-rose-600 hover:bg-rose-500 py-3 rounded-xl font-bold text-white shadow-lg shadow-rose-500/30 transition-all">Publish</button>
                </div>
            </form>
        </div>
    </div>

    <style>.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }</style>

    <script src="lang.js"></script>
    <script type="module">
        import { db, collection, addDoc, getDocs, doc, getDoc, deleteDoc, query, orderBy, auth } from './firebase.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        let currentProfile = { uid: null, name: 'Guest', avatar: '' };
        let isAdmin = false;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.replace("auth.html"); return; }
            currentProfile.uid = user.uid; 
            isAdmin = user.email === "thaituan.28012020@gmail.com";
            
            // KIỂM TRA BẢO TRÌ
            try {
                const maintSnap = await getDoc(doc(db, "settings", "maintenance"));
                if (maintSnap.exists() && maintSnap.data().videosLocked && !isAdmin) {
                    alert(localStorage.getItem('site_language') === 'vn' ? "Video Hub đang được bảo trì!" : "Video Hub is under maintenance!");
                    window.location.replace("index.html"); return;
                }
            } catch(e) {}

            const snap = await getDoc(doc(db, "users", user.uid));
            let username = user.email.split('@')[0]; 
            let avatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`;
            if (snap.exists()) { 
                if (snap.data().status === 'Banned') { window.location.replace("auth.html"); return; }
                username = snap.data().username || username; 
                if(snap.data().avatar && !snap.data().avatar.includes('placeholder')) avatar = snap.data().avatar;
            }
            currentProfile.name = username; currentProfile.avatar = avatar;
            
            let adminHeaderBadge = isAdmin ? `<span class="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded shadow-[0_0_8px_rgba(220,38,38,0.8)] border border-red-400">ADMIN</span>` : '';
            document.getElementById('header-auth').innerHTML = `
                <div class="flex flex-col items-end hidden md:flex">
                    <span class="${isAdmin ? 'text-red-400 font-extrabold' : 'text-gray-300 font-bold'} text-sm">${username}</span>
                    ${adminHeaderBadge}
                </div>
                <img src="${avatar}" onclick="window.location.href='my-vault.html'" class="w-10 h-10 rounded-full border-2 ${isAdmin?'border-red-500 shadow-[0_0_10px_rgba(220,38,38,0.6)]':'border-rose-500'} object-cover bg-gray-800 cursor-pointer hover:scale-110 transition-transform">
            `;
            loadVideos();
        });

        function getYoutubeId(url) {
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        window.submitVideo = async function(e) {
            e.preventDefault();
            const url = document.getElementById('vLink').value;
            try {
                await addDoc(collection(db, "videos"), { 
                    uid: currentProfile.uid, authorName: currentProfile.name, authorAvatar: currentProfile.avatar, 
                    isAdmin: isAdmin,
                    title: document.getElementById('vTitle').value, quality: document.getElementById('vQuality').value, url: url, timestamp: new Date().getTime() 
                });
                document.getElementById('upload-modal').classList.add('hidden'); e.target.reset(); loadVideos();
            } catch (error) { alert("Lỗi đăng tải: " + error.message); }
        };

        window.delVideo = async function(id) { if(confirm("Xóa Video này?")) { try { await deleteDoc(doc(db, "videos", id)); loadVideos(); } catch(e) { alert("Lỗi quyền!"); } } };

        async function loadVideos() {
            const container = document.getElementById('video-feed');
            try {
                const q = query(collection(db, "videos"), orderBy("timestamp", "desc"));
                const snap = await getDocs(q); container.innerHTML = '';
                if(snap.empty) { container.innerHTML = '<div class="h-full flex items-center justify-center text-gray-500 font-bold">Chưa có video nào. Trở thành người đầu tiên!</div>'; return; }

                snap.forEach((d) => {
                    const data = d.data();
                    const yId = getYoutubeId(data.url);
                    const postIsAdmin = data.isAdmin || data.authorName === 'admin' || data.authorName === 'thaituan.28012020';
                    
                    let mediaHtml = yId ? `<iframe class="w-full h-full object-cover pointer-events-auto" src="https://www.youtube.com/embed/${yId}?autoplay=0&controls=1&showinfo=0&rel=0&loop=1" frameborder="0" allowfullscreen></iframe>` : `<video src="${data.url}" class="w-full h-full object-contain bg-black" controls playsinline></video>`;
                    let delBtn = (isAdmin || currentProfile.uid === data.uid) ? `<button onclick="delVideo('${d.id}')" class="absolute top-24 right-4 bg-black/60 p-3 rounded-full text-white z-20 hover:text-red-500 hover:scale-110 transition backdrop-blur-sm border border-gray-700" title="Xóa"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>` : '';
                    let adminBadge = postIsAdmin ? `<span class="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-sm border border-red-500/50 shadow-[0_0_8px_rgba(220,38,38,0.8)] ml-2 tracking-widest">ADMIN</span>` : '';
                    let nameColor = postIsAdmin ? 'text-red-400 font-extrabold drop-shadow-[0_0_8px_rgba(239,68,68,0.5)]' : 'text-white font-bold';
                    let avatarBorder = postIsAdmin ? 'border-red-500 shadow-[0_0_10px_rgba(239,68,68,0.5)]' : 'border-white';

                    container.innerHTML += `
                        <div class="video-item h-screen w-full snap-start relative bg-black flex items-center justify-center group overflow-hidden">
                            ${mediaHtml}
                            <div class="absolute bottom-0 left-0 w-full p-4 pb-6 md:pb-8 bg-gradient-to-t from-black via-black/60 to-transparent flex items-end justify-between z-10 pointer-events-none">
                                <div class="flex-grow pr-16">
                                    <h3 class="${nameColor} text-[17px] drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] mb-2 flex items-center gap-2">
                                        @${data.authorName} ${adminBadge} <span class="bg-rose-600/90 text-white text-[10px] px-2 py-0.5 rounded border border-rose-500/50">${data.quality || 'HD RAW'}</span>
                                    </h3>
                                    <p class="text-[14px] text-gray-100 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] line-clamp-2 leading-snug">${data.title}</p>
                                    ${yId ? `<p class="text-[10px] text-gray-400 mt-2 italic">*Link Youtube có thể không tải được, hãy dùng Tool ngoài nhé!</p>` : ''}
                                </div>
                            </div>
                            
                            <div class="absolute bottom-28 right-4 flex flex-col items-center gap-6 z-20 pointer-events-auto">
                                <img src="${data.authorAvatar}" class="w-12 h-12 rounded-full border-2 ${avatarBorder} object-cover bg-gray-800">
                                <a href="${data.url}" target="_blank" class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-rose-600 transition-colors border border-white/30 shadow-xl" title="Xem nguồn / Tải về">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                </a>
                            </div>
                            ${delBtn}
                        </div>
                    `;
                });
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
