<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tools Vault | CoreVault</title>
<meta name="description" content="Kho công cụ cao cấp & miễn phí cho Gamer và Developer: tối ưu hệ thống, game, đồ họa.">
<meta name="theme-color" content="#111827">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CoreVault OS">
<meta property="og:title" content="Tools Vault | CoreVault">
<meta property="og:description" content="Kho công cụ cao cấp & miễn phí cho Gamer và Developer: tối ưu hệ thống, game, đồ họa.">
<meta property="og:image" content="https://www.corevaultos.com/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tools Vault | CoreVault">
<meta name="twitter:description" content="Kho công cụ cao cấp & miễn phí cho Gamer và Developer: tối ưu hệ thống, game, đồ họa.">
<meta name="twitter:image" content="https://www.corevaultos.com/og-image.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col" data-page="tools">
<div id="site-header"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-12 w-full flex-grow">
  <div class="w-full text-center mb-10">
    <h1 data-i18n="prod_title" class="text-4xl md:text-5xl font-extrabold text-white mb-4 tracking-tight">Products Vault</h1>
    <p data-i18n="hero_desc" class="text-gray-400 text-base md:text-lg max-w-2xl mx-auto">Your premier destination for premium tools.</p>
  </div>

  <div class="w-full flex flex-col lg:flex-row gap-4 mb-8 items-stretch lg:items-center justify-between bg-gray-800/50 p-4 rounded-2xl border border-gray-700 shadow-lg">
    <div class="relative w-full lg:w-96">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></div>
      <input type="search" id="searchInput" data-i18n="search_tools" autocomplete="off" class="w-full bg-gray-900 border border-gray-700 rounded-xl pl-12 pr-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="Search for tools...">
    </div>
    <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
      <select id="categoryFilter" class="w-full sm:w-auto bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 font-medium cursor-pointer">
        <option value="All" data-i18n="filter_all">All</option>
        <option value="Gaming" data-i18n="val_gaming">Gaming</option>
        <option value="System" data-i18n="val_system">System</option>
        <option value="Graphics" data-i18n="val_graphics">Graphics</option>
      </select>
      <select id="sortBy" class="w-full sm:w-auto bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 font-medium cursor-pointer">
        <option value="new" data-i18n="sort_newest">Newest</option>
        <option value="priceAsc" data-i18n="sort_price_asc">Price: low to high</option>
        <option value="priceDesc" data-i18n="sort_price_desc">Price: high to low</option>
        <option value="name" data-i18n="sort_name">Name A–Z</option>
      </select>
    </div>
  </div>

  <p id="result-count" class="text-sm text-gray-500 mb-4 font-medium"></p>

  <div id="ad-container" class="w-full hidden mb-10">
    <div class="bg-gray-800/50 border border-gray-700 border-dashed rounded-2xl flex items-center justify-center p-8 text-center relative overflow-hidden">
      <span class="absolute top-2 right-3 text-[10px] text-gray-500 uppercase tracking-widest" data-i18n="ad_label">Advertisement</span>
      <p class="text-gray-500 text-sm">AdSense</p>
    </div>
  </div>

  <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 w-full" aria-live="polite"></div>
  <div id="no-result" class="hidden w-full text-center py-16"><p data-i18n="no_match" class="text-gray-500 text-lg font-medium">No tools match your search.</p></div>
</main>

<div id="site-footer"></div>
<script src="layout.js"></script>
<script src="lang.js"></script>
<script type="module">
import { onUser, renderHeaderAuth, fetchPublicProducts, productCard, applyAds, tsOf, t, $ } from './common.js';

onUser((u, p) => renderHeaderAuth(p));
applyAds();

const box = $('#products-container'), none = $('#no-result'), count = $('#result-count');
let all = null;

function apply() {
  if (!all) return;
  const q = $('#searchInput').value.trim().toLowerCase();
  const cat = $('#categoryFilter').value, sort = $('#sortBy').value;
  let list = all.filter((p) => (cat === 'All' || p.category === cat) &&
    (!q || [p.name, p.descEn, p.descVn].some((s) => String(s || '').toLowerCase().includes(q))));
  const cmp = {
    new: (a, b) => tsOf(b.timestamp) - tsOf(a.timestamp),
    priceAsc: (a, b) => (a.price || 0) - (b.price || 0),
    priceDesc: (a, b) => (b.price || 0) - (a.price || 0),
    name: (a, b) => String(a.name).localeCompare(String(b.name))
  }[sort];
  list = [...list].sort(cmp);
  box.innerHTML = list.map((p) => productCard(p.id, p)).join('');
  none.classList.toggle('hidden', list.length > 0);
  count.textContent = t('tools_count', { n: list.length });
  window.updateLanguage();
}

async function load() {
  box.innerHTML = Array(6).fill('<div class="h-72 rounded-2xl bg-gray-800/60 border border-gray-700 animate-pulse"></div>').join('');
  try { all = await fetchPublicProducts(); apply(); }
  catch (e) {
    console.error(e);
    box.innerHTML = `<div class="col-span-full text-center py-12"><p class="text-red-400 mb-4" data-i18n="err_load">Could not load data.</p><button id="retry" data-i18n="btn_retry" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-lg font-bold">Retry</button></div>`;
    $('#retry').onclick = load; window.updateLanguage();
  }
}

// Lưu bộ lọc trên URL để chia sẻ / quay lại không mất
const params = new URLSearchParams(location.search);
if (params.get('q')) $('#searchInput').value = params.get('q');
if (params.get('cat')) $('#categoryFilter').value = params.get('cat');
let timer;
$('#searchInput').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(apply, 150); });
$('#categoryFilter').addEventListener('change', apply);
$('#sortBy').addEventListener('change', apply);
document.addEventListener('languagechange', apply);
load();
</script>
</body>
</html>
