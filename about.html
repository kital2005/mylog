<script src="layout.js"></script>
<script src="lang.js"></script>
<script type="module">
import { db, doc, getDoc } from './firebase.js';
import { onUser, renderHeaderAuth, applyAds, safeUrl, dicebear, esc, lang, t, $ } from './common.js';

onUser((u, p) => renderHeaderAuth(p));
applyAds();
let cfg = {};

function render() {
  const vn = lang() === 'vn';
  $('#avatar-img').src = safeUrl(cfg.avatar, { data: true }) || dicebear(cfg.name || 'LunarRider0');
  $('#name-display').textContent = cfg.name || 'LunarRider0';
  $('#role-display').textContent = (vn ? (cfg.roleVn || cfg.roleEn) : (cfg.roleEn || cfg.roleVn)) || t('about_role');
  const bio = (vn ? (cfg.bioVn || cfg.bioEn) : (cfg.bioEn || cfg.bioVn)) || t('about_bio_text');
  $('#bio-display').innerHTML = String(bio).split(/\n{2,}/).map((para) => `<p class="whitespace-pre-line break-words">${esc(para.trim())}</p>`).join('');
  const tags = String(cfg.tags || '').split(',').map((x) => x.trim()).filter(Boolean);
  $('#tags-container').innerHTML = tags.map((x) => `<span class="px-3 py-1 bg-gray-800 border border-gray-700 rounded-full text-xs text-gray-300 font-bold">${esc(x)}</span>`).join('');
  for (const k of ['twitch', 'tiktok', 'github']) {
    const a = $('#link-' + k), u = safeUrl(cfg[k]);
    a.hidden = !u; if (u) a.href = u;
  }
}
async function load() {
  try { const s = await getDoc(doc(db, 'settings', 'about')); if (s.exists()) cfg = s.data(); } catch (e) { console.warn(e); }
  render();
}
document.addEventListener('languagechange', render);
render(); load();
</script>
