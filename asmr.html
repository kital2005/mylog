<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

<body class="bg-[#0b0b12] text-gray-100 min-h-screen flex flex-col relative overflow-x-hidden" data-fab="off"><div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] bg-indigo-900/10 rounded-full blur-[150px] pointer-events-none"></div><div class="fixed bottom-[20%] left-[-10%] w-[400px] h-[400px] bg-purple-900/10 rounded-full blur-[120px] pointer-events-none"></div><header class="sticky top-0 z-40 bg-[#0b0b12]/80 backdrop-blur-xl border-b border-gray-800/60">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
    <a href="index.html" class="flex items-center gap-3"><img src="logo.svg" alt="" class="w-8 h-8 rounded-xl"><span class="text-lg md:text-xl font-black bg-gradient-to-r from-indigo-400 to-purple-500 bg-clip-text text-transparent tracking-tight">ASMR Relax Station</span></a>
    <div class="flex items-center gap-3">
      <button onclick="toggleLanguage()" class="text-xs font-bold border border-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-800" data-i18n="lang_btn">EN / VN</button>
      <button id="btn-donate" class="bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-gray-900 font-extrabold text-xs px-4 py-2 rounded-full shadow-lg transition-transform hover:scale-105">☕ <span data-i18n="asmr_donate">Donate</span></button>
      <div id="header-auth" class="flex items-center gap-2"></div>
    </div>
  </div>
</header>
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full flex-grow relative z-10">
  <div class="text-center mb-10">
    <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tight" data-i18n="asmr_title">Ambient & ASMR Station</h1>
    <p class="text-gray-400 text-sm md:text-base max-w-2xl mx-auto leading-relaxed" data-i18n="asmr_sub">Exclusive high-fidelity audio sessions to help you relax, focus, and sleep.</p>
  </div>
  <input type="search" id="q" data-i18n="asmr_search" autocomplete="off" class="block w-full max-w-md mx-auto mb-10 bg-[#12121f] border border-gray-800 rounded-full px-5 py-3 text-sm focus:outline-none focus:border-indigo-500">
  <div id="catalog" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8" aria-live="polite"></div>
</main>
<div id="donate-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4 backdrop-blur-md" role="dialog" aria-modal="true">
  <div class="bg-[#12121f] border border-gray-800 rounded-3xl p-8 w-full max-w-sm shadow-2xl relative text-center">
    <button id="donate-close" aria-label="Close" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-gray-800 w-9 h-9 rounded-full">✕</button>
    <div class="text-4xl mb-3">🎁</div>
    <h3 class="text-2xl font-black mb-2" data-i18n="asmr_support_title">Support My Work</h3>
    <p class="text-gray-400 text-sm mb-6 leading-relaxed" data-i18n="asmr_support_desc">All full-length sessions are free. Your donation helps me stay independent and improve my audio equipment!</p>
    <a href="https://paypal.me/thaituan2801" target="_blank" rel="noopener noreferrer" class="w-full bg-[#0070ba] hover:bg-[#005ea6] text-white font-black py-4 rounded-xl text-sm transition-all shadow-lg flex items-center justify-center" data-i18n="asmr_paypal">Send Support via PayPal</a>
  </div>
</div>
<script src="lang.js"></script>
<script type="module">
import { db, collection, getDocs, query, orderBy, limit } from './firebase.js';
import { onUser, renderHeaderAuth, esc, safeUrl, checkMaintenance, t, $ } from './common.js';

const dm = $('#donate-modal');
const openDonate = () => { dm.classList.remove('hidden'); dm.classList.add('flex'); };
const closeDonate = () => { dm.classList.add('hidden'); dm.classList.remove('flex'); };
$('#btn-donate').onclick = openDonate; $('#donate-close').onclick = closeDonate;
dm.addEventListener('click', (e) => { if (e.target === dm) closeDonate(); });

let items = null;
onUser(async (u, p) => { if (await checkMaintenance('asmrLocked', p)) return; renderHeaderAuth(p, { ring: 'border-indigo-500' }); }, { require: false });

async function load() {
  $('#catalog').innerHTML = Array(3).fill('<div class="h-64 rounded-3xl bg-[#12121f] border border-gray-800 animate-pulse"></div>').join('');
  try {
    const snap = await getDocs(query(collection(db, 'asmr_videos'), orderBy('timestamp', 'desc'), limit(60)));
    items = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render();
  } catch (e) { console.error(e); $('#catalog').innerHTML = `<p class="col-span-full text-center text-red-400 text-sm">${esc(t('err_load'))}</p>`; }
}
function render() {
  if (!items) return;
  const q = $('#q').value.trim().toLowerCase();
  const rows = items.filter((d) => !q || `${d.title} ${d.desc}`.toLowerCase().includes(q));
  if (!rows.length) { $('#catalog').innerHTML = `<p class="col-span-full text-center text-gray-600 text-sm py-10" data-i18n="asmr_empty">No sessions available.</p>`; return window.updateLanguage(); }
  $('#catalog').innerHTML = rows.map((d) => {
    const thumb = safeUrl(d.thumbnail) || `https://ui-avatars.com/api/?name=${encodeURIComponent(String(d.title || 'A').slice(0, 2))}&background=1e1e2f&color=6366f1&size=512`;
    const badge = d.isLimited
      ? `<span class="absolute top-3 right-3 bg-red-500 text-white text-[10px] font-extrabold px-3 py-1 rounded-full shadow-lg" data-i18n="asmr_limited">LIMITED KEY</span>`
      : `<span class="absolute top-3 right-3 bg-green-500 text-white text-[10px] font-extrabold px-3 py-1 rounded-full shadow-lg" data-i18n="val_free">FREE</span>`;
    return `<a href="asmr-play.html?id=${encodeURIComponent(d.id)}" class="bg-[#12121f] rounded-3xl border border-gray-800/80 hover:border-indigo-500/50 transition-all duration-300 shadow-xl overflow-hidden group flex flex-col hover:-translate-y-1">
      <div class="w-full aspect-video bg-gray-900 relative overflow-hidden"><img src="${esc(thumb)}" alt="" loading="lazy" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500">${badge}
        <div class="absolute inset-0 flex items-center justify-center"><span class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-xl">▶</span></div></div>
      <div class="p-5 md:p-6 flex flex-col flex-grow"><h2 class="text-lg font-bold mb-2 line-clamp-2 leading-tight">${esc(d.title)}</h2><p class="text-sm text-gray-400 line-clamp-2 mb-4">${esc(d.desc || '')}</p>
        <div class="mt-auto text-xs text-gray-500 font-medium">${esc(d.quality || 'Stereo Audio')}</div></div></a>`;
  }).join('');
  window.updateLanguage();
}
$('#q').addEventListener('input', render);
document.addEventListener('languagechange', render);
load();
</script>
</body>
</html>
